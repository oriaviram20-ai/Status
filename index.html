<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שליטה – ניהול החיים</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18212F">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#18212F; --muted:#64708A;
  --line:#DDE3EC; --accent:#0E9F87; --accent-soft:#D7F2EC; --warn:#C97D12; --warn-soft:#FBEBD3;
  --danger:#D14646; --danger-soft:#F9DEDE; --track:#E2E8F0; --bond:#D9A441; --cash:#8A97AE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131C; --surface:#18202D; --surface-2:#1F2938; --ink:#E9EDF4; --muted:#93A0B8;
    --line:#2A3546; --accent:#2CC7A8; --accent-soft:#163B36; --warn:#F0AE4E; --warn-soft:#3A2D18;
    --danger:#F06A6A; --danger-soft:#3D1F22; --track:#2A3546; --bond:#E0B45A; --cash:#7D8AA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#18202D; --surface-2:#1F2938; --ink:#E9EDF4; --muted:#93A0B8;
  --line:#2A3546; --accent:#2CC7A8; --accent-soft:#163B36; --warn:#F0AE4E; --warn-soft:#3A2D18;
  --danger:#F06A6A; --danger-soft:#3D1F22; --track:#2A3546; --bond:#E0B45A; --cash:#7D8AA3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.up{color:var(--accent)} .down{color:var(--danger)}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 112px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.top h1{font-size:22px;font-weight:700;margin:0}
.top p{margin:0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--cash)}
.sync.cloud i{background:var(--accent)}
@media (max-width:440px){.sync-t{display:none}.sync{padding:8px}.top h1{font-size:20px}.top-actions{gap:6px}}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.grid>*,.col>*{min-width:0}
.grid{display:grid;gap:16px}
@media (min-width:820px){.grid.two{grid-template-columns:1.05fr 1fr;align-items:start}}

.hero{background:var(--surface);border-radius:28px;padding:24px 22px;border:1px solid var(--line)}
.hero-label{color:var(--muted);font-size:15px;margin:0 0 4px}
.hero-num{font-size:clamp(42px,12vw,62px);font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:0}
.hero-num.neg{color:var(--danger)}
.flow{display:flex;gap:10px;margin-top:20px}
.flow div{flex:1;min-width:0;background:var(--surface-2);border-radius:16px;padding:12px}
.flow div>span{display:block;font-size:13px;color:var(--muted)}
.flow b{font-size:clamp(14px,4.4vw,19px);font-weight:700;white-space:nowrap}
.bar{height:10px;background:var(--track);border-radius:99px;margin-top:18px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar-legend{font-size:13px;color:var(--muted);margin-top:8px}

.worth{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right}
.worth small{display:block;color:var(--muted);font-size:14px}
.worth b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.worth .sub{font-size:13px;color:var(--muted)}

.level{background:var(--ink);color:var(--bg);border-radius:28px;padding:22px;border:0;width:100%;text-align:right;display:block}
.level-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.level small{opacity:.7;font-size:13px;display:block}
.level h2{margin:2px 0 0;font-size:26px;font-weight:800}
.level .stage{font-size:14px;opacity:.8;margin-top:2px}
.xp{font-size:40px;font-weight:800;line-height:1;text-align:left}
.xp em{font-style:normal;font-size:15px;opacity:.6;font-weight:500}
.path{display:flex;align-items:center;margin:22px 4px 8px}
.node{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid currentColor;opacity:.35}
.node.done{background:var(--accent);border-color:var(--accent);color:#fff;opacity:1}
.node.now{opacity:1;background:var(--bg);color:var(--ink);border-color:var(--bg);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 55%,transparent)}
.seg{flex:1;height:3px;background:currentColor;opacity:.25;margin:0 4px}
.seg.done{background:var(--accent);opacity:1}
.quest{margin-top:16px;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.quest b{display:block;font-size:15px}
.level .more{font-size:13px;opacity:.7;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.node.now{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 20%,transparent)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 button,.link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;padding:4px}
.panel p.note{margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border:0;border-radius:18px;padding:12px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:98px}
.tile .ic{font-size:20px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .sm{font-size:12px;color:var(--muted)}
@media (min-width:520px){.tile{padding:14px}.tile .nm{font-size:15px}.tile .sm{font-size:13px}}
.dl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.dl:first-of-type{border-top:0}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.dl .t{flex:1;min-width:0}
.dl .t b{display:block;font-weight:600;font-size:15px}
.dl .t span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.demo{background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.demo button{border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}

.back{background:none;border:0;color:var(--muted);font-size:15px;padding:6px 0;margin-bottom:6px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 18px}
.page-head h1{margin:0;font-size:28px;font-weight:800}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.page-head .sum{font-size:26px;font-weight:800;text-align:left}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:right}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{font-size:13px;color:var(--muted)}
.row .amt{font-weight:700;text-align:left}
.row .amt small{display:block;font-weight:500;font-size:12px}
.fab{position:fixed;left:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);z-index:9}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:140px}

/* Investments */
.pf-hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px}
.pf-hero .big{font-size:clamp(38px,11vw,54px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:2px 0 6px}
.pf-hero .gain{font-size:16px;font-weight:600}
.pf-hero .since{font-size:13px;color:var(--muted);margin-top:2px}
.chart{margin-top:14px;width:100%;height:auto;display:block}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alloc .bar{height:14px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.alloc h4{margin:14px 0 2px;font-size:14px;font-weight:600}
.alloc h4:first-child{margin-top:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.fact>span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:17px}
.fact.flag{background:var(--warn-soft)}
.hold .spark{flex:none}
.calc label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:12px 0 6px}
.calc label b{color:var(--ink)}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.calc .res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.calc .res div{background:var(--surface-2);border-radius:14px;padding:12px}
.calc .res div>span{display:block;font-size:12px;color:var(--muted)}
.calc .res b{font-size:20px}
.calc .res .cost{background:var(--danger-soft)}
.calc .res .cost b{color:var(--danger)}
.inline-in{display:flex;gap:8px}
.inline-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px}

/* Docs */
.types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.type{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px;font-size:14px}
.type[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:20px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop b{font-size:16px}
.drop span{font-size:13px;color:var(--muted)}
.drop img{max-height:160px;max-width:100%;border-radius:12px}
.status{font-size:14px;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:8px}
.status.err{color:var(--danger)}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.result{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.result h4{margin:0;font-size:18px}
.result .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv div>span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:16px}
.insight{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.actions-list{margin:0 0 12px;padding:0 18px 0 0;font-size:14px;color:var(--muted)}
.plan{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.plan b{display:block;margin-bottom:4px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.backdrop{align-items:center}.sheet{border-radius:26px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet h2{margin:0 0 16px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;margin:-4px 0 12px;min-height:1px}
.ok-msg{color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.actions .btn.danger{flex:0 0 auto}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.check{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check .mark{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.check.ok .mark{background:var(--accent);color:#fff}
.check b{display:block}
.check span{font-size:14px;color:var(--muted)}
.review p{margin:0 0 12px;font-size:15px}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:22px;justify-content:center;text-align:center}

/* KPIs & challenges */
.kbar{display:flex;gap:4px;margin:18px 0 4px}
.kbar i{flex:1;height:8px;border-radius:99px;background:currentColor;opacity:.25}
.kbar i.good{background:var(--accent);opacity:1}
.kbar i.near{background:var(--warn);opacity:1}
.kbar i.bad{background:var(--danger);opacity:1}
.focus{margin-top:12px;display:grid;gap:8px}
.focus>div{background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.focus b{font-weight:600}
.focus>div>span{opacity:.75;text-align:left}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface-2);border:0;border-radius:18px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:3px;min-height:138px}
.kpi .kn{font-size:13px;color:var(--muted);line-height:1.3}
.kpi .kval{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .kt{font-size:12px;color:var(--muted)}
.kpi .chip{align-self:flex-start;margin-top:2px}
.meter{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;border-radius:99px}
.bg-good{background:var(--accent)} .bg-near{background:var(--warn)} .bg-bad{background:var(--danger)} .bg-na,.bg-info{background:var(--cash)}
.chip.good{background:var(--accent-soft);color:var(--accent)} .chip.near{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--danger-soft);color:var(--danger)} .chip.na,.chip.info{background:var(--surface-2);color:var(--muted)}
.kpi .chip.na,.kpi .chip.info{background:var(--surface)}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.score b{font-size:34px;font-weight:800}
.score span{color:var(--muted);font-size:14px}
.ch{background:var(--surface-2);border:0;border-radius:18px;padding:16px;width:100%;text-align:right;display:block}
.ch + .ch{margin-top:10px}
.ch-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ch-top b{font-size:16px}
.ch-sub{font-size:13px;color:var(--muted);margin-top:2px}
.ch .meter{height:8px;margin:12px 0 6px;background:var(--track)}
.ch .meter i{background:var(--accent)}
.ch-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tpl{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:right}
.tpl:first-of-type{border-top:0}
.tpl .t{flex:1}
.tpl .t b{display:block}
.tpl .t span{font-size:13px;color:var(--muted)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.day{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.day[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
.step input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.fromto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fromto>div{background:var(--surface-2);border-radius:12px;padding:10px}
.fromto>div>span{display:block;font-size:12px;color:var(--muted)}
.fromto b{font-size:16px}
.big-k{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.mk{grid-template-columns:repeat(3,1fr)}}
.mk .fact>span+b+span{margin-top:2px}
/* Year */
.yr-chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.yr-hero{background:var(--ink);color:var(--bg);border-radius:28px;padding:22px}
.yr-hero small{opacity:.7;font-size:13px;display:block}
.yr-hero .big{font-size:clamp(34px,10vw,50px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.yr-hero .sub{opacity:.8;font-size:14px}
.yr-hero .fc{margin-top:14px;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:14px;padding:12px 14px;font-size:14px}
.facts6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.facts6{grid-template-columns:repeat(3,1fr)}}
.facts6 .fact>span+b+span{font-size:12px}
.hbar{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.hbar .tr{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px}
.hl{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hl:first-of-type{border-top:0}
.hl .ic{font-size:20px;flex:none}

.link-out{color:var(--accent);font-weight:600;font-size:14px}

  try{ const v1=JSON.parse(localStorage.getItem('life-control-v1')); if(v1&&v1.items&&!v1.demo) return normalize(v1); }catch(e){}
  return null;
}

/* ---------- Storage & sync ---------- */
const DEVICE = (()=>{ try{ let d=localStorage.getItem('lc-device'); if(!d){ d=uid(); localStorage.setItem('lc-device',d);} return d; }catch(e){ return uid(); } })();
let state = loadLocal() || normalize(demoData());
const sync = {mode:'local', ref:null, writing:false, pending:false, timer:null};
function saveLocalOnly(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function save(){ recordMonth(); state.updatedAt=Date.now(); state.deviceId=DEVICE; saveLocalOnly(); if(sync.mode==='cloud'){ clearTimeout(sync.timer); sync.timer=setTimeout(pushCloud,900); } }
async function pushCloud(){
  if(!sync.ref) return;
  if(sync.writing){ sync.pending=true; return; }
  sync.writing=true;
  try{ await sync.ref.set(clone(state)); }
  catch(e){ if(e&&e.code==='quota_exceeded') toast('האחסון מלא. מחק מסמכים ישנים כדי להמשיך לסנכרן.'); }
  finally{ sync.writing=false; if(sync.pending){ sync.pending=false; pushCloud(); } }
}
async function initCloud(){
  if(!window.claude||!window.claude.use) return;
  const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
  if(db) sync.db=db;
  if(!db||!user) return;
  let id=null; try{ id=await user.id(); }catch(e){}
  if(!id) return;
  const ref=db.collection('data/users/'+id).doc('state');
  let snap; try{ snap=await ref.get(); }catch(e){ return; }
  sync.ref=ref; sync.mode='cloud';
  if(snap.exists){
    const d=snap.data()||{};
    if(state.demo || !state.updatedAt || (d.updatedAt||0)>=state.updatedAt) state=normalize(clone(d));
    else pushCloud();
  } else if(!state.demo){ pushCloud(); }
  saveLocalOnly(); if(!document.querySelector('.backdrop')) render();
  if(sync.subscribed) return; sync.subscribed=true;
  ref.onSnapshot(s=>{
    if(!s.exists||s.metadata.hasPendingWrites) return;
    const d=s.data()||{};
    if(d.deviceId!==DEVICE && (d.updatedAt||0)>(state.updatedAt||0)){
      state=normalize(clone(d)); saveLocalOnly();
      if(!document.querySelector('.backdrop')) render();
    }
  },()=>{});
}
let sampleFn=null, sampleImgs=null;

  const s=await claude.use('sample'); if(!s) return;

/* ---------- Calculations ---------- */
const monthly = it => it.amount/it.freq;
function totals(){
  const income=state.items.filter(i=>i.cat==='income').reduce((a,i)=>a+monthly(i),0);
  const byCat={}; EXPENSE_CATS.forEach(c=>byCat[c]=state.items.filter(i=>i.cat===c).reduce((a,i)=>a+monthly(i),0));
  const expenses=Object.values(byCat).reduce((a,b)=>a+b,0);
  return {income,expenses,left:income-expenses,byCat};
}
const fxOf = h => h.cur==='USD' ? (state.fx.usd||1) : 1;
const hVal = h => (h.units||0)*(h.price||0)*fxOf(h);
const hCost = h => (h.units||0)*(h.cost||0)*fxOf(h);
function portfolio(){
  const hs=state.holdings; let value=0,cost=0,feeW=0; const byType={stock:0,bond:0,cash:0}, byCur={ILS:0,USD:0};
  hs.forEach(h=>{ const v=hVal(h); value+=v; cost+=hCost(h); feeW+=v*(h.fee||0); byType[h.type]=(byType[h.type]||0)+v; byCur[h.cur]=(byCur[h.cur]||0)+v; });
  const gain=value-cost;
  return {value,cost,gain,gainPct:cost>0?gain/cost*100:0,fee:value>0?feeW/value:0,byType,byCur,count:hs.length};
}
const savingsTotal = () => state.savings.reduce((a,s)=>a+(s.balance||0),0);
function feeFlag(s){
  if(s.type==='pension') return (s.depFee||0)>1.5 || (s.accFee||0)>0.3;
  if(s.type==='hishtalmut'||s.type==='gemel') return (s.accFee||0)>0.7;
  return false;
}
function lastChange(){
  const sn=state.snapshots; if(sn.length<2) return null;
  const a=sn[sn.length-2].v, b=sn[sn.length-1].v; if(!a) return null;
  return {abs:b-a,pct:(b-a)/a*100,since:sn[sn.length-2].d};
}
function pushHist(h,p,d){ d=d||today(); h.hist=h.hist||[]; const last=h.hist[h.hist.length-1]; if(last&&last.d>=d) last.p=p; else h.hist.push({d,p}); if(h.hist.length>60) h.hist=h.hist.slice(-60); }
function recordSnapshot(){ const v=Math.round(portfolio().value); const d=today(); const sn=state.snapshots; const last=sn[sn.length-1]; if(last&&last.d===d) last.v=v; else sn.push({d,v}); if(sn.length>120) state.snapshots=sn.slice(-120); }
function lifeStage(){
  if(!state.birthYear) return null;
  const age=new Date().getFullYear()-state.birthYear;
  const name=age<25?'שלב היציאה לעצמאות':age<35?'שלב הביסוס':age<50?'שלב הבנייה':age<65?'שלב השיא':'שלב הקציר';
  return {age,name};
}
const ST_LABEL={good:'ביעד',near:'קרוב',bad:'דורש תשומת לב',na:'חסרים נתונים',info:'מעקב'};
function metrics(){
  const t=totals(), p=portfolio();
  const emRows=state.savings.filter(s=>s.type==='emergency');
  const emergency=emRows.reduce((a,s)=>a+(s.balance||0),0);
  const longTerm=state.savings.filter(s=>['gemel','hishtalmut','savings'].includes(s.type));
  const monthlySave=(state.investPlan.monthly||0)+longTerm.reduce((a,s)=>a+(s.monthly||0),0);
  let fw=0,fv=0; state.holdings.forEach(h=>{ const v=hVal(h); fw+=v*(h.fee||0); fv+=v; }); state.savings.forEach(s=>{ fw+=(s.balance||0)*(s.accFee||0); fv+=(s.balance||0); });
  return {t,p,emergency,monthlySave,rate:t.income>0?monthlySave/t.income:null,flagged:state.savings.filter(feeFlag),
    late:state.deadlines.filter(d=>daysUntil(d.date)<0),soon:state.deadlines.filter(d=>{const n=daysUntil(d.date);return n>=0&&n<=30;}),
    avgFee:fv?fw/fv:null,investable:p.value+longTerm.reduce((a,s)=>a+(s.balance||0),0),
    emFee:emergency?emRows.reduce((a,s)=>a+(s.balance||0)*(s.accFee||0),0)/emergency:0.1,subs:t.byCat.subs,billsIns:t.byCat.bills+t.byCat.insurance};
}

function chCur(c,m){ const T=TPL[c.tpl]||TPL.custom; return T.cur(m||metrics(),c); }
function chProgress(c,m){

  if(T.mode==='up') p=c.target>c.baseline?(cur-c.baseline)/(c.target-c.baseline):1;
  else if(T.mode==='down') p=c.baseline>c.target?(c.baseline-cur)/(c.baseline-c.target):1;
  else p=c.target?cur/c.target:0;
  if(c.steps&&c.steps.length&&T.mode==='down'&&c.tpl==='fees') p=Math.max(p,c.steps.filter(s=>s.done).length/c.steps.length*0.9);

function chInfo(c,pr){

/* ---------- Charts ---------- */
function linePath(arr,min,span,w,h,pad){ return arr.map((v,i)=>`${(pad+i*(w-2*pad)/Math.max(1,arr.length-1)).toFixed(1)},${(h-pad-(v-min)/span*(h-2*pad)).toFixed(1)}`).join(' '); }
function lineChart(seriesList,{w=340,h=110,colors=['var(--accent)'],area=true,label}={}){
  const all=seriesList.flat(); if(all.length<2) return '';
  const min=Math.min(...all), max=Math.max(...all), span=(max-min)||1, pad=6;
  let out=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||'גרף')}" preserveAspectRatio="none" style="height:${h}px">`;
  seriesList.forEach((s,i)=>{
    const pts=linePath(s,min,span,w,h,pad); const c=colors[i]||colors[0];
    if(area&&i===0) out+=`<polygon points="${pad},${h-pad} ${pts} ${w-pad},${h-pad}" fill="${c}" opacity=".12"/>`;
    out+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  });
  return out+'</svg>';
}
function spark(vals){
  if(!vals||vals.length<2) return '';
  const w=64,h=26,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const c=vals[vals.length-1]>=vals[0]?'var(--accent)':'var(--danger)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${linePath(vals,min,span,w,h,3)}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}
function stackBar(parts){ const tot=parts.reduce((a,p)=>a+p.v,0)||1; return `<div class="bar" aria-hidden="true">${parts.filter(p=>p.v>0).map(p=>`<i style="width:${p.v/tot*100}%;background:${p.c}"></i>`).join('')}</div><div class="legend">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.l} ${N(Math.round(p.v/tot*100)+'%')}</span>`).join('')}</div>`; }

function yearStats(y){
  y=String(y);
  const ks=Object.keys(state.history).filter(k=>k.startsWith(y)).sort(); if(!ks.length) return null;
  const H=ks.map(k=>Object.assign({ym:k},state.history[k]));
  const sum=f=>H.reduce((a,h)=>a+(+h[f]||0),0);
  const nwH=H.filter(h=>h.nw!=null), first=nwH[0], last=nwH[nwH.length-1];
  const net=H.map(h=>({ym:h.ym,left:(h.inc||0)-(h.fix||0)-(h.varx||0),spend:(h.fix||0)+(h.varx||0)}));
  const best=net.reduce((a,b)=>b.left>a.left?b:a,net[0]), costly=net.reduce((a,b)=>b.spend>a.spend?b:a,net[0]);
  const cats={}; ks.forEach(k=>{ const sp=state.spend[k]; if(sp&&sp.cats) for(const c in sp.cats) cats[c]=(cats[c]||0)+sp.cats[c]; });
  const inc=sum('inc'), saved=sum('saved');
  const st={y,H,ks,n:H.length,inc,fix:sum('fix'),varx:sum('varx'),hasVar:H.some(h=>h.varx!=null),saved,rate:inc?saved/inc:0,
    nw0:first?first.nw:null,nw1:last?last.nw:null,nwD:first&&last?last.nw-first.nw:null,best,costly,cats,em:last?last.em:null,fixLast:H[H.length-1].fix,
    chDone:state.challenges.filter(c=>c.status==='done'&&c.closedTs&&String(new Date(c.closedTs).getFullYear())===y),
    docs:state.docs.filter(d=>String(new Date(d.ts).getFullYear())===y).length, checksDone:Object.keys(state.checks[y]||{}).length};
  if(y===String(new Date().getFullYear())&&H.length>=2){
    const lastM=+ks[ks.length-1].slice(5), remain=12-lastM, step=nwH.length>1?(last.nw-first.nw)/(nwH.length-1):0;
    st.forecast={remain,saved:saved+saved/H.length*remain,nw:last?last.nw+step*remain:null};
  }
  return st;
}

function barsChart(H){
  const w=340,h=150,pad=20,n=H.length, max=Math.max(1,...H.map(x=>Math.max(x.inc||0,(x.fix||0)+(x.varx||0))));
  const gw=(w-2*pad)/n, bw=Math.max(4,Math.min(12,gw/3));
  let out=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="הכנסות מול הוצאות לפי חודש" style="height:auto">`;
  H.forEach((x,i)=>{ const cx=pad+gw*i+gw/2, top=h-pad-8, hi=(x.inc||0)/max*top, hf=(x.fix||0)/max*top, hv=(x.varx||0)/max*top;
    out+=`<rect x="${(cx-bw-1).toFixed(1)}" y="${(h-pad-hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" rx="3" fill="var(--accent)"/>`;
    out+=`<rect x="${(cx+1).toFixed(1)}" y="${(h-pad-hf).toFixed(1)}" width="${bw}" height="${hf.toFixed(1)}" rx="2" fill="var(--ink)" opacity=".75"/>`;
    if(hv) out+=`<rect x="${(cx+1).toFixed(1)}" y="${(h-pad-hf-hv).toFixed(1)}" width="${bw}" height="${hv.toFixed(1)}" rx="2" fill="var(--bond)"/>`;
    out+=`<text x="${cx.toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="inherit">${monthShort(x.ym)}</text>`; });
  return out+'</svg>';
}
function catBars(cats,limit){

}

async function yearWords(y){

  const prompt=`Write a short year-in-review for a private household finance app. Hebrew, warm and plain, no markdown, no bullets. Exactly 4 short paragraphs separated by a blank line, each starting with a two or three word topic and a colon: what went well, where the money went, what to watch, focus for next year. Use the actual numbers. If the user wrote lessons or goals, connect to them. No investment advice and no product or company names.

  yearCtl=new AbortController();
  const show=txt=>{ const b=document.getElementById('yw'); if(b) b.innerHTML=txt.split(/\n\s*\n/).map(x=>`<p>${esc(x.trim())}</p>`).join(''); };
  try{ const {text}=await sampleFn(prompt,{signal:yearCtl.signal,onText:({text})=>show(text)}); show(text); }

async function exportYear(y){
  const S=yearStats(y); if(!S) return;

  const csv='\ufeff'+rows.map(r=>r.join(',')).join('\n');
  if(downloadsCap){ try{ await downloadsCap.save({filename:`shlita-${y}.csv`,data:csv}); return; }catch(e){} }
  if(!window.claude&&fileDownload(`shlita-${y}.csv`,csv,'text/csv')){ toast('הקובץ נשמר בהורדות'); return; }
  try{ await navigator.clipboard.writeText(csv); toast('הסיכום הועתק'); }catch(e){ toast('לא הצלחתי לייצא כאן'); }
}

let XLSXp=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(XLSXp) return XLSXp;
  XLSXp=new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=()=>res(window.XLSX); sc.onerror=()=>{ XLSXp=null; rej(new Error('load')); }; document.head.appendChild(sc); });
  return XLSXp; }
const impUI={busy:false,error:'',res:null,mode:'replace'};
function parseAmount(v){ if(typeof v==='number') return v; let x=String(v||'').replace(/[^\d.,\-]/g,'').replace(/,/g,''); if(!x) return NaN; let neg=x.endsWith('-')||x.startsWith('-'); x=x.replace(/-/g,''); const n=parseFloat(x); return neg?-n:n; }
function parseDate(v){
  if(v instanceof Date&&!isNaN(v)) return v.toISOString().slice(0,10);
  if(typeof v==='number'&&v>30000&&v<60000){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
  const m=String(v||'').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/); if(!m) return null;
  let y=+m[3]; if(y<100) y+=2000; const mo=+m[2], d=+m[1]; if(mo<1||mo>12||d<1||d>31) return null;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function detectCols(rows){
  for(let r=0;r<Math.min(rows.length,60);r++){
    const row=rows[r].map(c=>String(c??'').trim()); if(row.filter(Boolean).length<3) continue;
    const di=row.findIndex(c=>/תאריך/.test(c)&&!/חיוב/.test(c))>=0?row.findIndex(c=>/תאריך/.test(c)&&!/חיוב/.test(c)):row.findIndex(c=>/תאריך|date/i.test(c));
    let ai=row.findIndex(c=>/סכום\s*(ה)?חיוב/.test(c)); if(ai<0) ai=row.findIndex(c=>/סכום|חובה|amount/i.test(c));
    const mi=row.findIndex(c=>/בית\s*(ה)?עסק|שם\s*(ה)?עסק|תיאור|פרטים|תאור|description|merchant/i.test(c));
    if(di>=0&&ai>=0&&mi>=0) return {hr:r,di,ai,mi};
  }
  return null;
}
async function importStatement(inp){ const f=inp.files[0]; inp.value=''; if(f) return importFile(f); }
async function importFile(f){
  impUI.busy=true; impUI.error=''; impUI.res=null; render();
  try{
    const XLSX=await loadXLSX();
    let wb;
    if(/\.csv$/i.test(f.name)||f.type==='text/csv'){ const buf=await f.arrayBuffer(); let txt=new TextDecoder('utf-8').decode(buf); if(txt.includes('\ufffd')) txt=new TextDecoder('windows-1255').decode(buf); wb=XLSX.read(txt,{type:'string',cellDates:true}); }
    else wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const tx=[];
    for(const name of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
      let c=detectCols(rows);
      if(!c&&sampleFn&&rows.length){ try{ const g=await sampleFn.json(`These are the first rows of an Israeli credit card or bank statement spreadsheet, as a JSON array of rows. Find the header row and the column indexes (0-based) of the transaction date, the merchant or description, and the charged amount. Reply with only {"headerRow":number,"dateCol":number,"merchantCol":number,"amountCol":number} or {"headerRow":-1} if this is not a statement.\n${JSON.stringify(rows.slice(0,15).map(r=>r.slice(0,12).map(x=>String(x).slice(0,40))))}`,{modelTier:'quick'}); if(g&&g.headerRow>=0) c={hr:g.headerRow,di:g.dateCol,mi:g.merchantCol,ai:g.amountCol}; }catch(e){} }
      if(!c) continue;
      for(let r=c.hr+1;r<rows.length;r++){
        const row=rows[r]; const m=String(row[c.mi]??'').trim(), a=parseAmount(row[c.ai]), d=parseDate(row[c.di]);
        if(!m||!isFinite(a)||a===0||/סה.?כ|סך הכל|total|יתרה/i.test(m)||looksSensitive(m)&&/\d{6,}/.test(m)) continue;
        tx.push({m:m.slice(0,60),a,d});
      }
    }
    if(!tx.length) throw new Error('nocols');
    const cnt={}; tx.forEach(t=>{ if(t.d){ const k=t.d.slice(0,7); cnt[k]=(cnt[k]||0)+1; } });
    const months=Object.keys(cnt).sort(); const ym=months.length?months.reduce((a,b)=>cnt[b]>cnt[a]?b:a,months[0]):ymNow();
    const map={}, unknown=[];
    [...new Set(tx.map(t=>t.m))].forEach(m=>{ const r=CAT_RULES.find(([re])=>re.test(m)); if(r) map[m]=r[1]; else unknown.push(m); });
    if(unknown.length&&sampleFn){
      try{ const g=await sampleFn.json(`Classify each merchant name from an Israeli card statement into exactly one category from this list: ${JSON.stringify(SPEND_CATS)}. Reply with only a JSON object mapping each merchant string exactly as given to its category.\nMerchants: ${JSON.stringify(unknown.slice(0,180))}`,{modelTier:'quick'});
        if(g&&typeof g==='object') for(const k in g) if(SPEND_CATS.includes(g[k])) map[k]=g[k]; }catch(e){}
    }
    const cats={}, byM={}; let total=0;
    tx.forEach(t=>{ const c=map[t.m]||'אחר'; cats[c]=(cats[c]||0)+t.a; byM[t.m]=(byM[t.m]||0)+t.a; total+=t.a; });
    for(const k in cats) cats[k]=Math.round(cats[k]);
    impUI.res={ym,months,total:Math.round(total),cats,n:tx.length,top:Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  }catch(e){ impUI.error=e&&e.message==='load'?'לא הצלחתי לטעון את קורא הקבצים. נסה שוב.':e&&e.message==='nocols'?'לא זיהיתי טבלת עסקאות בקובץ. נסה את קובץ האקסל המקורי מאתר חברת האשראי או הבנק.':'לא הצלחתי לקרוא את הקובץ.'; }
  finally{ impUI.busy=false; if(view.name==='docs'){ render(); const c=document.getElementById('imp-card'); if(c&&(impUI.res||impUI.error)) c.scrollIntoView({behavior:'smooth',block:'start'}); } }
}

function daily(){

const withTimeout = (p,ms) => Promise.race([Promise.resolve(p).catch(()=>null),new Promise(r=>setTimeout(()=>r('timeout'),ms))]);
async function loadMarket(){
  if(!sync.db) return null;
  try{ const s=await sync.db.doc('market/latest').get(); if(s.exists){ market=clone(s.data()); try{ localStorage.setItem('lc-market',JSON.stringify(market)); }catch(e){} return market; } }catch(e){}
  return null;
}
async function pullCloud(){
  if(!sync.ref) return initCloud();
  try{ const s=await sync.ref.get(); if(s.exists){ const d=s.data()||{}; if((d.updatedAt||0)>(state.updatedAt||0)){ state=normalize(clone(d)); saveLocalOnly(); } } }catch(e){}
}
function applyMarketFx(){
  const f=market&&market.fx; if(!f||!f.usd) return false;
  if(state.fx.src==='manual'&&(state.fx.d||'')>=(f.date||'')) return false;
  if(state.fx.src==='market'&&state.fx.usd===f.usd) return false;
  state.fx={usd:+f.usd,src:'market',d:f.date||today()};
  if(state.holdings.some(h=>h.cur==='USD')) recordSnapshot();
  return true;
}
function applyMarketPrices(){
  const P=market&&market.prices; if(!P) return 0;
  const map={}; for(const k in P) map[k.toLowerCase()]=P[k];
  let n=0;
  state.holdings.forEach(h=>{ const q=h.ticker&&map[h.ticker.toLowerCase()]; if(!q||!isFinite(+q.p)) return;
    const last=(h.hist||[])[h.hist.length-1]; if(h.price===+q.p&&last&&last.d>=(q.date||'')) return;
    h.price=+q.p; if(q.cur) h.cur=q.cur==='USD'?'USD':'ILS'; pushHist(h,h.price,q.date); n++; });
  if(n) recordSnapshot();
  return n;
}

let reviewCtl=null;
async function reviewPortfolio(){
  if(!sampleFn) return;
  const p=portfolio(), t=totals(), st=lifeStage();
  const em=state.savings.filter(s=>s.type==='emergency').reduce((a,s)=>a+(s.balance||0),0);
  const summary={age:st?st.age:null,monthlyIncome:Math.round(t.income),monthlyLeftAfterFixed:Math.round(t.left),emergencyFund:em,emergencyMonths:t.expenses?+(em/t.expenses).toFixed(1):null,monthlyInvesting:state.investPlan.monthly,
    totalValue:Math.round(p.value),stockSharePct:p.value?Math.round(p.byType.stock/p.value*100):0,usdSharePct:p.value?Math.round(p.byCur.USD/p.value*100):0,weightedFeePct:+p.fee.toFixed(2),
    holdings:state.holdings.map(h=>({name:h.name,type:h.type,currency:h.cur,sharePct:p.value?Math.round(hVal(h)/p.value*100):0,feePct:h.fee,gainSinceBuyPct:h.cost?+((h.price-h.cost)/h.cost*100).toFixed(1):null}))};
  const prompt=`You are reviewing a private household's investment snapshot inside their budgeting app. The user lives in Israel and thinks in shekels.
Write in Hebrew, warm and plain. 4 to 5 short paragraphs separated by a blank line, each one or two sentences, each starting with a two-or-three-word topic and a colon. No markdown, no bullets, no bold.
Lens: the passive approach from the book "השקעות לעצלנים" (broad low-cost index funds, steady monthly deposits, patience, low fees) together with its known blind spots: currency exposure for someone living in shekels, US estate-tax exposure on US-domiciled funds held directly, bonds not always moving opposite to stocks, the need for an emergency fund so a market drop never forces a sale, and matching the stock share to age and goals.
Point out what is working and what is worth checking. Do not name securities to buy or sell and do not tell them to buy or sell. Finish with one sentence saying this is not personal investment advice.
Data: ${JSON.stringify(summary)}`;
  sheet(`<h2>בדיקת תיק</h2><div class="review" id="rv"><p class="status"><span class="dots">חושב</span></p></div>
    <div class="actions"><button class="btn ghost" id="rv-stop" onclick="reviewCtl&&reviewCtl.abort()">עצור</button><button class="btn primary" onclick="closeSheet()">סגור</button></div>`);
  reviewCtl=new AbortController();
  const box=()=>document.getElementById('rv');
  const show=txt=>{ const b=box(); if(b) b.innerHTML=txt.split(/\n\s*\n/).map(x=>`<p>${esc(x.trim())}</p>`).join(''); };
  try{ const {text}=await sampleFn(prompt,{signal:reviewCtl.signal,onText:({text})=>show(text)}); show(text); }
  catch(e){ if(e.text) show(e.text); if(e.code!=='cancelled'&&box()) box().insertAdjacentHTML('beforeend',`<p class="status err">${esc(sampleErr(e.code))}</p>`); }
  finally{ const s=document.getElementById('rv-stop'); if(s) s.remove(); }
}

function pickDoc(inp){ const f=inp.files[0]; if(!f) return; if(/\.(xlsx|xls|csv)$/i.test(f.name)){ inp.value=''; importFile(f); return; } if(docUI.url) URL.revokeObjectURL(docUI.url); docUI.file=f; docUI.url=URL.createObjectURL(f); docUI.result=null; docUI.error=''; docUI.done=false; render(); }
const DOC_SCHEMA={
  payslip:'{"gross":number|null,"net":number|null,"incomeTax":number|null,"bituachLeumi":number|null,"pensionEmployee":number|null,"pensionEmployer":number|null,"hishtalmut":number|null,"creditPoints":number|null}',
  pension:'{"kind":"pension"|"hishtalmut"|"gemel","fundName":string|null,"balance":number|null,"depositFeePct":number|null,"accumFeePct":number|null,"monthlyDeposit":number|null,"yearReturnPct":number|null}',
  bill:'{"category":"electricity"|"water"|"arnona"|"phone"|"internet"|"gas"|"other","provider":string|null,"amount":number|null,"periodMonths":number|null}',
  portfolio:'{"holdings":[{"name":string,"ticker":string|null,"units":number|null,"price":number|null,"currency":"ILS"|"USD","type":"stock"|"bond"|"cash"}],"totalValue":number|null,"usdRate":number|null}',
  insurance:'{"insurer":string|null,"kind":string|null,"monthlyPremium":number|null}',
  receipt:'{"merchant":string|null,"total":number|null,"date":"YYYY-MM-DD"|null,"category":one of '+JSON.stringify(SPEND_CATS)+'}',
  other:'{}'
};
async function scanDoc(){
  if(!sampleFn||!docUI.file) return;
  const pick=docUI.type, auto=pick==='auto', t=totals();
  const types=auto?Object.keys(DOC_SCHEMA):[pick];
  const prev=state.docs.filter(d=>auto||d.type===pick).slice(0,auto?6:3).map(d=>({type:d.type,period:d.period,issuer:d.issuer,fields:d.fields}));
  const prompt=`You read one photo of an Israeli personal-finance or life-admin document for a private household app.
${auto?'First decide what it is: payslip (תלוש שכר), pension (annual pension, hishtalmut or gemel report), bill (electricity, water, arnona, phone, internet, gas), portfolio (a broker or bank investments screen), insurance (a policy or premium notice), receipt (a single purchase receipt or invoice), or other (any other letter or notice, for example from ביטוח לאומי, רשות המסים, a vehicle test or a renewal).':`The user says it is: ${DOC_TYPES[pick].label}.`}
Strict privacy rule: never output ID numbers (תעודת זהות), bank account, card, IBAN, policy, member or employee numbers, addresses or phone numbers. Leave them out entirely.
If prices on an Israeli broker screen are in agorot, convert them to shekels. Numbers are plain numbers without currency signs or commas.
Field schemas by type:
${types.map(k=>k+': '+DOC_SCHEMA[k]).join('\n')}
Reply with only one JSON object:
{"docType": ${auto?'one of the type names above':JSON.stringify(pick)}, "title": short Hebrew title, "period": "YYYY-MM" or null, "issuer": company or office name only, or null, "amounts": [{"label": Hebrew label, "value": number}] (up to 6 key money figures in shekels, most important first; no units, percentages or counts here), "fields": the object for that type's schema, "due": {"date": "YYYY-MM-DD", "what": short Hebrew description} or null (a payment due date, renewal, appointment or deadline printed on the document), "insight": one or two short Hebrew sentences: what changed compared with the previous documents below, with numbers, or if there are none, the single thing most worth noticing, "actions": up to 3 short Hebrew suggestions to check, compare or ask about}
If the photo cannot be read, set "title" to "לא זוהה" and explain briefly in "insight".
Do not give investment advice.
Previous documents: ${JSON.stringify(prev)}
Context: today is ${today()}, monthly income ₪${Math.round(t.income)}, monthly fixed expenses ₪${Math.round(t.expenses)}.`;
  docUI.busy=true; docUI.error=''; docUI.result=null; docUI.done=false; render();
  docCtl=new AbortController();
  try{
    const r=await sampleFn.json(prompt,{images:[docUI.file],signal:docCtl.signal});
    if(!r||typeof r!=='object') throw {code:'invalid_json'};
    const type=DOC_SCHEMA[r.docType]?r.docType:(auto?'other':pick);
    const due=r.due&&typeof r.due==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(String(r.due.date||''))?{date:String(r.due.date),what:String(r.due.what||'')}:null;
    docUI.result=scrub({type,auto,title:String(r.title||DOC_TYPES[type].label),period:r.period||null,issuer:r.issuer||null,
      amounts:Array.isArray(r.amounts)?r.amounts.filter(a=>a&&isFinite(+a.value)).slice(0,6).map(a=>({label:String(a.label||''),value:+a.value})):[],
      fields:r.fields&&typeof r.fields==='object'?r.fields:{},due,insight:String(r.insight||''),actions:Array.isArray(r.actions)?r.actions.slice(0,3).map(String):[]});
  }catch(e){ if(e.code!=='cancelled') docUI.error=sampleErr(e.code); }
  finally{ docUI.busy=false; if(view.name==='docs') render(); }
}
function sampleErr(code){
  return ({not_granted:'צריך לאשר לאפליקציה להשתמש ב־Claude כדי לקרוא מסמכים.',sampling_disabled:'קריאה עם Claude לא זמינה בחשבון הזה.',rate_limited:'יותר מדי בקשות כרגע. נסה שוב בעוד כמה דקות.',
    image_rejected:'לא ניתן לקרוא את הקובץ. נסה תמונה חדה יותר בפורמט JPG או PNG.',images_unavailable:'שליחת תמונות לא זמינה כאן.',invalid_json:'לא הצלחתי לקרוא את המסמך. נסה תמונה חדה יותר.',
    refused:'לא ניתן לעבד את התמונה הזו.',session_expired:'צריך להתחבר מחדש ל־Claude.'})[code]||'משהו השתבש בקריאה. נסה שוב.';
}
function applyPlanBase(r){
  const f=r.fields||{}, lines=[]; let run=null;
  if(r.title==='לא זוהה') return {lines,run};
  if(r.type==='payslip'&&num(f.net)){ lines.push(`ההכנסה ״משכורת״ תתעדכן ל־${fmt(f.net)} נטו`); run=()=>upsertItem('income','משכורת',num(f.net),1); }
  if(r.type==='bill'&&num(f.amount)){ const name=BILL_CAT[f.category]||f.provider||'חשבון'; const fr=[1,2,3,12].includes(+f.periodMonths)?+f.periodMonths:1;
    lines.push(`החשבון ״${name}״ יתעדכן ל־${fmt(f.amount)} (${FREQ[fr]})`); run=()=>upsertItem('bills',name,num(f.amount),fr); }
  if(r.type==='insurance'&&num(f.monthlyPremium)){ const name=[f.kind?'ביטוח '+String(f.kind).replace(/^ביטוח\s*/,''):'ביטוח',f.insurer].filter(Boolean).join(' · ');
    lines.push(`״${name}״ יתעדכן ל־${fmt(f.monthlyPremium)} בחודש`); run=()=>upsertItem('insurance',name,num(f.monthlyPremium),1); }
  if(r.type==='pension'&&num(f.balance)){ const kind=SAV_TYPES[f.kind]?f.kind:'pension'; const name=f.fundName?String(f.fundName):SAV_TYPES[kind];
    lines.push(`״${name}״ תתעדכן ליתרה ${fmt(f.balance)}${num(f.accumFeePct)!==null?`, דמי ניהול ${num(f.depositFeePct)??0}% מהפקדה ו־${num(f.accumFeePct)}% מצבירה`:''}`);
    run=()=>{ let s=state.savings.find(x=>norm(x.name)===norm(name))||state.savings.find(x=>x.type===kind);
      const data={balance:num(f.balance),monthly:num(f.monthlyDeposit)??(s?s.monthly:0),depFee:num(f.depositFeePct)??(s?s.depFee:0),accFee:num(f.accumFeePct)??(s?s.accFee:0)};
      if(s) Object.assign(s,data); else state.savings.push({id:uid(),name,type:kind,...data}); }; }
  if(r.type==='portfolio'&&Array.isArray(f.holdings)&&f.holdings.length){
    const hs=f.holdings.filter(h=>h&&h.name&&num(h.price)!==null);
    hs.forEach(h=>{ const ex=findHolding(h); lines.push(`${ex?'עדכון':'חדש'}: ${h.name} · ${num(h.units)??(ex?ex.units:'?')} × ${fmtP(num(h.price),h.currency)}`); });
    if(num(f.usdRate)) lines.push(`שער הדולר יתעדכן ל־${num(f.usdRate)}`);
    run=()=>{ if(num(f.usdRate)) state.fx.usd=num(f.usdRate);
      hs.forEach(x=>{ let h=findHolding(x); const price=num(x.price); const cur=x.currency==='USD'?'USD':'ILS';
        if(h){ if(num(x.units)!==null) h.units=num(x.units); h.price=price; h.cur=cur; }
        else { h={id:uid(),name:String(x.name).slice(0,80),ticker:x.ticker?String(x.ticker).replace(/[^\w.\-]/g,'').slice(0,12):'',type:H_TYPES[x.type]?x.type:'stock',cur,units:num(x.units)||0,cost:price,price,fee:0,hist:[]}; state.holdings.push(h); }
        pushHist(h,price); });
      recordSnapshot(); }; }
  return {lines,run};
}
function applyPlan(r){
  const b=applyPlanBase(r), f=r.fields||{}, lines=[...b.lines], runs=b.run?[b.run]:[];
  if(r.title==='לא זוהה') return {lines:[],run:null};
  if(r.type==='receipt'&&num(f.total)){
    const cat=SPEND_CATS.includes(f.category)?f.category:'אחר', d=/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')?f.date:today(), ym=d.slice(0,7);
    lines.push(`הוצאה של ${fmt(num(f.total))} ב״${cat}״ תתווסף ל${monthLong(ym)}`); runs.push(()=>addSpend(ym,cat,num(f.total)));
  }
  if(r.due&&r.due.date&&daysUntil(r.due.date)>=-1){
    const name=(r.due.what||r.title).slice(0,60);
    if(!state.deadlines.some(x=>x.date===r.due.date&&norm(x.name)===norm(name))){
      lines.push(`מועד חדש: ${name}, ${shortDate(r.due.date)}`);
      runs.push(()=>{ if(!state.deadlines.some(x=>x.date===r.due.date&&norm(x.name)===norm(name))) state.deadlines.push({id:uid(),name,type:dlTypeFor(r),date:r.due.date}); });
    }
  }
  return {lines,run:runs.length?()=>runs.forEach(fn=>fn()):null};
}
function dlTypeFor(r){ const t=(r.title||'')+' '+(r.issuer||'')+' '+((r.due&&r.due.what)||''); return /ביטוח לאומי/.test(t)?'ביטוח לאומי':/טסט|רישוי|רישיון רכב/.test(t)?'טסט לרכב':/מס הכנסה|רשות המסים/.test(t)?'מס הכנסה':/בדיק|רופא|מרפא/.test(t)?'בדיקה רפואית':/חידוש|דרכון|רישיון/.test(t)?'חידוש מסמך':'אחר'; }
function addSpend(ym,cat,amt){
  const sp=state.spend[ym]||{total:0,cats:{},n:0,ts:0,src:'receipt'};
  sp.cats[cat]=Math.round((sp.cats[cat]||0)+amt); sp.total=Math.round((sp.total||0)+amt); sp.n=(sp.n||0)+1; sp.ts=Date.now(); state.spend[ym]=sp;
  if(ym!==ymNow()&&state.history[ym]) state.history[ym].varx=Math.round(varPart(sp));
}
const DOC_GO={payslip:"go('cat','income')",bill:"go('cat','bills')",insurance:"go('cat','insurance')",pension:"go('savings')",portfolio:"go('invest')",receipt:"go('home')",other:"go('deadlines')"};
function findHolding(x){ const tk=x.ticker?String(x.ticker).replace(/[^\w.\-]/g,'').toLowerCase():''; return state.holdings.find(h=>tk&&h.ticker&&h.ticker.toLowerCase()===tk)||state.holdings.find(h=>norm(h.name)===norm(x.name)); }
function upsertItem(cat,name,amount,freq){ const it=state.items.find(i=>i.cat===cat&&norm(i.name)===norm(name)); if(it){ it.amount=amount; it.freq=freq; } else state.items.push({id:uid(),cat,name,amount,freq}); }
function resultView(r){
  const plan=applyPlan(r);
  return `<div class="result">
    <h4>${esc(r.title)}</h4><div class="meta">${r.auto?`זוהה: ${DOC_TYPES[r.type].icon} ${DOC_TYPES[r.type].label} · `:''}${[r.issuer,r.period].filter(Boolean).map(esc).join(' · ')}</div>
    ${r.amounts.length?`<div class="kv">${r.amounts.map(a=>`<div><span>${esc(a.label)}</span><b>${N(fmt(a.value))}</b></div>`).join('')}</div>`:''}
    ${r.insight?`<div class="insight">${esc(r.insight)}</div>`:''}

    ${docUI.done?`<p class="status ok-msg">✓ נשמר${plan.run?' ועודכן באפליקציה':''}</p>${DOC_GO[r.type]?`<button class="btn ghost" style="width:100%" onclick="${DOC_GO[r.type]}">לראות איפה זה עודכן</button>`:''}`
      :`${plan.lines.length?`<div class="plan"><b>מה יתעדכן באפליקציה</b>${plan.lines.map(esc).join('<br>')}</div>`:''}
      <div class="btn-row">${plan.run?`<button class="btn primary" onclick="commitDoc(true)">עדכן ושמור</button>`:''}<button class="btn ghost" onclick="commitDoc(false)">${plan.run?'רק שמור בהיסטוריה':'שמור בהיסטוריה'}</button></div>`}
  </div>`;
}
function commitDoc(apply){
  const r=docUI.result; if(!r) return;
  if(apply){ const p=applyPlan(r); if(p.run) p.run(); }
  if(r.title!=='לא זוהה'){
    state.docs.unshift({id:uid(),ts:Date.now(),type:r.type,title:r.title,period:r.period,issuer:r.issuer,amounts:r.amounts,insight:r.insight,fields:r.fields});
    if(state.docs.length>60) state.docs=state.docs.slice(0,60);
  }
  docUI.done=true; save(); render(); toast(apply?'עודכן ונשמר':'נשמר בהיסטוריה');
}
function openDoc(id){

  return `

  <div class="grid two">
    <div class="col">
      <section class="panel"><h3>מועדים <button onclick="editDeadline(null)">+ הוסף</button></h3>${list.length?list.map(dlRow).join(''):`<p class="empty">אין מועדים. הוסף את הראשון.</p>`}</section>
    </div>
    <div class="col">

        <p class="note">${!pr.car||!pr.reservist?'פריטים לרכב ולמילואים יופיעו אם תסמן אותם בהגדרות. ':''}${hidden?`<button class="link" onclick="state.checkOff={};save();render()">הצג ${hidden} פריטים שהסתרת</button>`:''} הסימונים מתאפסים בכל שנה חדשה.</p>
      </section>
    </div>
  </div>`;
}

function saveDeadline(id){
  const name=document.getElementById('d-name').value.trim(), type=document.getElementById('d-type').value, date=document.getElementById('d-date').value;

  if(!name||!date) return err.textContent='צריך שם ותאריך.';

  const d=id&&state.deadlines.find(x=>x.id===id);

  save(); closeSheet(); render();
}
function delDeadline(id){ state.deadlines=state.deadlines.filter(x=>x.id!==id); save(); closeSheet(); render(); }

let toastT=null;
function toast(msg){ const r=document.getElementById('toast-root'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>r.innerHTML='',2600); }
function openSettings(){

function saveSettings(){ const y=parseInt(document.getElementById('s-year').value); state.birthYear=y>1900?y:null;
  const city=document.getElementById('s-city').value.trim().slice(0,40), dis=parseInt(document.getElementById('s-dis').value), deg=parseInt(document.getElementById('s-deg').value);
  state.profile={city:looksSensitive(city)?'':city,dischargeYear:dis>1980?dis:null,degreeYear:deg>1980?deg:null,reservist:document.getElementById('s-res').checked,car:document.getElementById('s-car').checked}; const fx=num(document.getElementById('s-fx').value); if(fx&&fx>0&&fx!==state.fx.usd){ state.fx={usd:fx,src:'manual',d:today()}; recordSnapshot(); } save(); closeSheet(); render(); }
function fileDownload(name,text,type){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); return true; }catch(e){ return false; } }
async function exportData(){
  const text=JSON.stringify(state,null,2), name=`shlita-backup-${today()}.json`, err=document.getElementById('s-err');
  if(downloadsCap){ try{ await downloadsCap.save({filename:name,data:text}); return; }catch(e){} }
  if(!window.claude&&fileDownload(name,text)){ toast('הגיבוי נשמר בהורדות'); return; }
  try{ await navigator.clipboard.writeText(text); err.className='err ok-msg'; err.textContent='הגיבוי הועתק. הדבק אותו בפתק ושמור.'; }catch(e){ err.textContent='לא הצלחתי לייצא כאן.'; }
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t); if(!d.items) throw 0; state=normalize(scrub(d)); state.demo=false; save(); recordSnapshot(); closeSheet(); render(); toast('הגיבוי נטען'); })
   .catch(()=>{ document.getElementById('s-err').textContent='הקובץ לא נראה כמו גיבוי של האפליקציה.'; });
}
