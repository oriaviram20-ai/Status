<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18212F">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#18212F; --muted:#64708A;
  --line:#DDE3EC; --accent:#0E9F87; --accent-soft:#D7F2EC; --warn:#C97D12; --warn-soft:#FBEBD3;
  --danger:#D14646; --danger-soft:#F9DEDE; --track:#E2E8F0; --bond:#D9A441; --cash:#8A97AE;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131C; --surface:#18202D; --surface-2:#1F2938; --ink:#E9EDF4; --muted:#93A0B8;
    --line:#2A3546; --accent:#2CC7A8; --accent-soft:#163B36; --warn:#F0AE4E; --warn-soft:#3A2D18;
    --danger:#F06A6A; --danger-soft:#3D1F22; --track:#2A3546; --bond:#E0B45A; --cash:#7D8AA3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#18202D; --surface-2:#1F2938; --ink:#E9EDF4; --muted:#93A0B8;
  --line:#2A3546; --accent:#2CC7A8; --accent-soft:#163B36; --warn:#F0AE4E; --warn-soft:#3A2D18;
  --danger:#F06A6A; --danger-soft:#3D1F22; --track:#2A3546; --bond:#E0B45A; --cash:#7D8AA3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.up{color:var(--accent)} .down{color:var(--danger)}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 112px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.top h1{font-size:22px;font-weight:700;margin:0}
.top p{margin:0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--cash)}
.sync.cloud i{background:var(--accent)}
@media (max-width:440px){.sync-t{display:none}.sync{padding:8px}.top h1{font-size:20px}.top-actions{gap:6px}}
.col{display:grid;gap:16px;align-content:start;min-width:0}
.grid>*,.col>*{min-width:0}
.grid{display:grid;gap:16px}
@media (min-width:820px){.grid.two{grid-template-columns:1.05fr 1fr;align-items:start}}

.hero{background:var(--surface);border-radius:28px;padding:24px 22px;border:1px solid var(--line)}
.hero-label{color:var(--muted);font-size:15px;margin:0 0 4px}
.hero-num{font-size:clamp(42px,12vw,62px);font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:0}
.hero-num.neg{color:var(--danger)}
.flow{display:flex;gap:10px;margin-top:20px}
.flow div{flex:1;min-width:0;background:var(--surface-2);border-radius:16px;padding:12px}
.flow div>span{display:block;font-size:13px;color:var(--muted)}
.flow b{font-size:clamp(14px,4.4vw,19px);font-weight:700;white-space:nowrap}
.bar{height:10px;background:var(--track);border-radius:99px;margin-top:18px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar-legend{font-size:13px;color:var(--muted);margin-top:8px}

.worth{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:right}
.worth small{display:block;color:var(--muted);font-size:14px}
.worth b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.worth .sub{font-size:13px;color:var(--muted)}

.level{background:var(--ink);color:var(--bg);border-radius:28px;padding:22px;border:0;width:100%;text-align:right;display:block}
.level-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.level small{opacity:.7;font-size:13px;display:block}
.level h2{margin:2px 0 0;font-size:26px;font-weight:800}
.level .stage{font-size:14px;opacity:.8;margin-top:2px}
.xp{font-size:40px;font-weight:800;line-height:1;text-align:left}
.xp em{font-style:normal;font-size:15px;opacity:.6;font-weight:500}
.path{display:flex;align-items:center;margin:22px 4px 8px}
.node{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid currentColor;opacity:.35}
.node.done{background:var(--accent);border-color:var(--accent);color:#fff;opacity:1}
.node.now{opacity:1;background:var(--bg);color:var(--ink);border-color:var(--bg);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 55%,transparent)}
.seg{flex:1;height:3px;background:currentColor;opacity:.25;margin:0 4px}
.seg.done{background:var(--accent);opacity:1}
.quest{margin-top:16px;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.quest b{display:block;font-size:15px}
.level .more{font-size:13px;opacity:.7;margin-top:10px}
@media (prefers-reduced-motion:no-preference){.node.now{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 20%,transparent)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 button,.link{background:none;border:0;color:var(--accent);font-size:14px;font-weight:600;padding:4px}
.panel p.note{margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface-2);border:0;border-radius:18px;padding:12px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:98px}
.tile .ic{font-size:20px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .sm{font-size:12px;color:var(--muted)}
@media (min-width:520px){.tile{padding:14px}.tile .nm{font-size:15px}.tile .sm{font-size:13px}}
.dl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.dl:first-of-type{border-top:0}
.chip{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.dl .t{flex:1;min-width:0}
.dl .t b{display:block;font-weight:600;font-size:15px}
.dl .t span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.demo{background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.demo button{border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap}

.back{background:none;border:0;color:var(--muted);font-size:15px;padding:6px 0;margin-bottom:6px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 18px}
.page-head h1{margin:0;font-size:28px;font-weight:800}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.page-head .sum{font-size:26px;font-weight:800;text-align:left}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:right}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{font-size:13px;color:var(--muted)}
.row .amt{font-weight:700;text-align:left}
.row .amt small{display:block;font-weight:500;font-size:12px}
.fab{position:fixed;left:20px;bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);z-index:9}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:140px}

/* Investments */
.pf-hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px}
.pf-hero .big{font-size:clamp(38px,11vw,54px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:2px 0 6px}
.pf-hero .gain{font-size:16px;font-weight:600}
.pf-hero .since{font-size:13px;color:var(--muted);margin-top:2px}
.chart{margin-top:14px;width:100%;height:auto;display:block}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alloc .bar{height:14px;margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.alloc h4{margin:14px 0 2px;font-size:14px;font-weight:600}
.alloc h4:first-child{margin-top:0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.fact{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.fact>span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:17px}
.fact.flag{background:var(--warn-soft)}
.hold .spark{flex:none}
.calc label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:12px 0 6px}
.calc label b{color:var(--ink)}
.calc input[type=range]{width:100%;accent-color:var(--accent)}
.calc .res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.calc .res div{background:var(--surface-2);border-radius:14px;padding:12px}
.calc .res div>span{display:block;font-size:12px;color:var(--muted)}
.calc .res b{font-size:20px}
.calc .res .cost{background:var(--danger-soft)}
.calc .res .cost b{color:var(--danger)}
.inline-in{display:flex;gap:8px}
.inline-in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px}

/* Docs */
.types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.type{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 14px;font-size:14px}
.type[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:20px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop b{font-size:16px}
.drop span{font-size:13px;color:var(--muted)}
.drop img{max-height:160px;max-width:100%;border-radius:12px}
.status{font-size:14px;color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:8px}
.status.err{color:var(--danger)}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.result{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
.result h4{margin:0;font-size:18px}
.result .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv div>span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:16px}
.insight{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.actions-list{margin:0 0 12px;padding:0 18px 0 0;font-size:14px;color:var(--muted)}
.plan{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.plan b{display:block;margin-bottom:4px}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.backdrop{align-items:center}.sheet{border-radius:26px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet h2{margin:0 0 16px;font-size:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:16px}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:14px;margin:-4px 0 12px;min-height:1px}
.ok-msg{color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.actions .btn.danger{flex:0 0 auto}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.check{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check .mark{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.check.ok .mark{background:var(--accent);color:#fff}
.check b{display:block}
.check span{font-size:14px;color:var(--muted)}
.review p{margin:0 0 12px;font-size:15px}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:22px;justify-content:center;text-align:center}

/* KPIs & challenges */
.kbar{display:flex;gap:4px;margin:18px 0 4px}
.kbar i{flex:1;height:8px;border-radius:99px;background:currentColor;opacity:.25}
.kbar i.good{background:var(--accent);opacity:1}
.kbar i.near{background:var(--warn);opacity:1}
.kbar i.bad{background:var(--danger);opacity:1}
.focus{margin-top:12px;display:grid;gap:8px}
.focus>div{background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.focus b{font-weight:600}
.focus>div>span{opacity:.75;text-align:left}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface-2);border:0;border-radius:18px;padding:14px;text-align:right;display:flex;flex-direction:column;gap:3px;min-height:138px}
.kpi .kn{font-size:13px;color:var(--muted);line-height:1.3}
.kpi .kval{font-size:24px;font-weight:800;letter-spacing:-.5px}
.kpi .kt{font-size:12px;color:var(--muted)}
.kpi .chip{align-self:flex-start;margin-top:2px}
.meter{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;border-radius:99px}
.bg-good{background:var(--accent)} .bg-near{background:var(--warn)} .bg-bad{background:var(--danger)} .bg-na,.bg-info{background:var(--cash)}
.chip.good{background:var(--accent-soft);color:var(--accent)} .chip.near{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--danger-soft);color:var(--danger)} .chip.na,.chip.info{background:var(--surface-2);color:var(--muted)}
.kpi .chip.na,.kpi .chip.info{background:var(--surface)}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.score b{font-size:34px;font-weight:800}
.score span{color:var(--muted);font-size:14px}
.ch{background:var(--surface-2);border:0;border-radius:18px;padding:16px;width:100%;text-align:right;display:block}
.ch + .ch{margin-top:10px}
.ch-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ch-top b{font-size:16px}
.ch-sub{font-size:13px;color:var(--muted);margin-top:2px}
.ch .meter{height:8px;margin:12px 0 6px;background:var(--track)}
.ch .meter i{background:var(--accent)}
.ch-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tpl{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:right}
.tpl:first-of-type{border-top:0}
.tpl .t{flex:1}
.tpl .t b{display:block}
.tpl .t span{font-size:13px;color:var(--muted)}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.day{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.day[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;cursor:pointer}
.step input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.fromto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.fromto>div{background:var(--surface-2);border-radius:12px;padding:10px}
.fromto>div>span{display:block;font-size:12px;color:var(--muted)}
.fromto b{font-size:16px}
.big-k{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0}
.mk{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.mk{grid-template-columns:repeat(3,1fr)}}
.mk .fact>span+b+span{margin-top:2px}
/* Year */
.yr-chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.yr-hero{background:var(--ink);color:var(--bg);border-radius:28px;padding:22px}
.yr-hero small{opacity:.7;font-size:13px;display:block}
.yr-hero .big{font-size:clamp(34px,10vw,50px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.yr-hero .sub{opacity:.8;font-size:14px}
.yr-hero .fc{margin-top:14px;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:14px;padding:12px 14px;font-size:14px}
.facts6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.facts6{grid-template-columns:repeat(3,1fr)}}
.facts6 .fact>span+b+span{font-size:12px}
.hbar{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.hbar .tr{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px}
.hl{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hl:first-of-type{border-top:0}
.hl .ic{font-size:20px;flex:none}
.hl small{display:block;font-size:13px;color:var(--muted)}

const DEVICE = (()=>{ try{ let d=localStorage.getItem('lc-device'); if(!d){ d=uid(); localStorage.setItem('lc-device',d);} return d; }catch(e){ return uid(); } })();

async function pushCloud(){

    if(!document.querySelector('.backdrop')) render();

  catch(e){
    if(e&&e.name==='MergeConflict') onSyncConflict(e);
    else if(e&&e.code==='quota_exceeded') toast('האחסון מלא. מחק מסמכים ישנים כדי להמשיך לסנכרן.');
    else if(e&&e.code==='permission-denied') toast('הענן דחה את השמירה. אם זה חוזר, רענן את הדף.');
    else if(e&&e.code==='mergelib-missing') toast('רכיב הסנכרון לא נטען. רענן את הדף.');

function onSyncConflict(e){

  if(cs){ state=normalize(clone(cs)); saveLocalOnly(); setBase(cs,cs.v); }

}
function showConflictBanner(){

    +'<button class="btn" onclick="retryPending()">נסה שוב</button>'

function hideConflictBanner(){ const b=document.getElementById('sync-conflict-banner'); if(b) b.remove(); }

async function mergeLegacyDraft(){ let raw; try{ raw=localStorage.getItem('lc-legacy-draft'); }catch(e){ raw=null; } if(!raw) return dismissLegacyDraft(); let draft; try{ draft=JSON.parse(raw).state; }catch(e){ return dismissLegacyDraft(); } const base=JSON.parse(localStorage.getItem('lc-base')||'null'); if(!base){ toast('המיזוג בוטל: חסר בסיס להשוואה בטוחה. הטיוטה הישנה נשמרת ולא נכתב דבר לענן'); return; } const merged=window.mergeLib.mergeState(JSON.parse(JSON.stringify(state)),draft,base); try{ state=normalize(merged); }catch(e){ state=merged; } saveLocalOnly(); render(); dismissLegacyBanner(); await pushCloud(); }

function adoptRemote(d){ state=normalize(clone(d)); saveLocalOnly(); setBase(d,d.v); sync.dirty=false; if(!document.querySelector('.backdrop')) render(); }
async function initCloud(){
  if(window.FB&&FB.user){
    const r=FB.ref();
    sync.db=null;
    const ref={
      set:d=>FB.save(r,d),
      get:async()=>{ const x=await FB.load(r); return {exists:!!x,data:()=>x}; },
      onSnapshot:(cb,err)=>FB.watch(r,(x,pending)=>cb({exists:!!x,data:()=>x,metadata:{hasPendingWrites:pending}}),err)
    };
    let snap; try{ snap=await ref.get(); }catch(e){ toast('לא הצלחתי להתחבר לשמירה בענן'); return; }
    sync.ref=ref; sync.mode='cloud';
    if(snap.exists){
      const d=snap.data()||{};
      if(state.demo || !state.updatedAt || (d.updatedAt||0)>=(state.updatedAt||0)) adoptRemote(d);
      else if(localStorage.getItem('lc-base')){ setBase(d,d.v); pushCloud(); }
      else { // first versioned contact, no common base: preserve local as draft, never auto-union
        try{ localStorage.setItem('lc-legacy-draft', JSON.stringify({at:Date.now(), state})); }catch(e){}
        adoptRemote(d); showLegacyBanner();
      }
    } else if(!state.demo){ pushCloud(); }
    saveLocalOnly(); if(!document.querySelector('.backdrop')) render();
    if(sync.subscribed) return; sync.subscribed=true;
    ref.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const d=s.data()||{};
      if(d.deviceId!==DEVICE && (d.updatedAt||0)>(state.updatedAt||0)){
        if(sync.dirty||sync.writing){ sync.remotePending=d; return; }
        adoptRemote(d);
      }
    },()=>{});
    if(localStorage.getItem('lc-legacy-draft')) showLegacyBanner(); // unresolved draft survives reloads until explicit choice
    return;
  }
  if(!window.claude||!window.claude.use) return;
  const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
  if(db) sync.db=db;
  if(!db||!user) return;
  let id=null; try{ id=await user.id(); }catch(e){}
  if(!id) return;
  const ref=db.collection('data/users/'+id).doc('state');
  let snap; try{ snap=await ref.get(); }catch(e){ return; }
  sync.ref=ref; sync.mode='cloud';
  if(snap.exists){
    const d=snap.data()||{};
    if(state.demo || !state.updatedAt || (d.updatedAt||0)>=state.updatedAt) state=normalize(clone(d));
    else pushCloud();
  } else if(!state.demo){ pushCloud(); }
  saveLocalOnly(); if(!document.querySelector('.backdrop')) render();
  if(sync.subscribed) return; sync.subscribed=true;
  ref.onSnapshot(s=>{
    if(!s.exists||s.metadata.hasPendingWrites) return;
    const d=s.data()||{};
    if(d.deviceId!==DEVICE && (d.updatedAt||0)>(state.updatedAt||0)){
      state=normalize(clone(d)); saveLocalOnly();
      if(!document.querySelector('.backdrop')) render();
    }
  },()=>{});
}

/* ---------- Calculations ---------- */

/* ===== Data freshness: every number says when it was last checked, with a traffic light =====

const fAge=d=>d?daysSince(d):9999;
const fLvl=(age,g,y)=>age<=g?'ok':age<=y?'stale':'miss';
const isoOf=t=>t?isoLocal(new Date(t)):null;
/* markets close on weekends: allow a bit more */
const mktGreen=()=>{ const wd=new Date().getDay(); return wd===0||wd===1?3:wd===6?2:1; };
function itemLastSeen(i){
  const W=itemWords(i.name); let best=null;
  if(W.length) state.tx.forEach(t=>{ if(t.a>0&&W.some(w=>norm(t.m).includes(w))&&Math.abs(t.a-i.amount)<=Math.max(3,i.amount*0.3)&&(!best||t.d>best.d)) best={d:t.d,src:'תנועה בכרטיס'}; });
  (state.docs||[]).forEach(d=>{ const P=docBudgetPlan(d); const f=d.fields||{};
    const hit=(P&&P.cat===i.cat&&norm(P.name)===norm(i.name))||(W.length&&W.some(w=>norm(d.title+' '+(f.provider||'')).includes(w))&&!/cancel|ביטול|בוטל/i.test((f.category||'')+d.title));
    if(!hit) return; const dt=[f.paymentDate,f.expenseDate,f.splitwiseExpenseDate].find(x=>/^\d{4}-\d{2}-\d{2}/.test(x||''))||(d.period?d.period+'-28':null)||isoOf(d.ts);
    if(dt&&(!best||dt.slice(0,10)>best.d)) best={d:dt.slice(0,10),src:'מסמך: '+d.title}; });
  return best;
}
function itemFresh(i){
  if(i.cat==='income'){ const ps=latestPayslip(); return {st:incomeLvl(ps),d:ps&&ps.period?ps.period+'-01':null,src:ps?'תלוש '+ps.period.split('-').reverse().join('/'):'אין תלוש'}; }
  if(itemEnded(i)) return {st:'ok',d:i.end,src:'בוטל'};
  const L=itemLastSeen(i); if(!L) return {st:'miss',d:null,src:'לא נמצא חיוב או מסמך'};
  const per=(i.freq||1)*31; return {st:fLvl(fAge(L.d),per+10,per+40),d:L.d,src:L.src};
}
function latestPayslip(){ return (state.docs||[]).filter(d=>d.type==='payslip'&&/^\d{4}-\d{2}$/.test(d.period||'')).sort((a,b)=>b.period.localeCompare(a.period)||(b.issuer?1:0)-(a.issuer?1:0))[0]||null; }
function incomeLvl(ps){ if(!ps) return 'miss'; const exp=ymShift(ymNow(),new Date().getDate()>=12?-1:-2); return ps.period>=exp?'ok':ps.period>=ymShift(exp,-1)?'stale':'miss'; }

function yearStats(y){
  y=String(y);
  const ks=Object.keys(state.history).filter(k=>k.startsWith(y)).sort(); if(!ks.length) return null;
  const H=ks.map(k=>Object.assign({ym:k},state.history[k]));
  const sum=f=>H.reduce((a,h)=>a+(+h[f]||0),0);
  const nwH=H.filter(h=>h.nw!=null), first=nwH[0], last=nwH[nwH.length-1];
  const net=H.map(h=>({ym:h.ym,left:(h.inc||0)-(h.fix||0)-(h.varx||0),spend:(h.fix||0)+(h.varx||0)}));
  const best=net.reduce((a,b)=>b.left>a.left?b:a,net[0]), costly=net.reduce((a,b)=>b.spend>a.spend?b:a,net[0]);
  const cats={}; ks.forEach(k=>{ const sp=state.spend[k]; if(sp&&sp.cats) for(const c in sp.cats) cats[c]=(cats[c]||0)+sp.cats[c]; });
  const inc=sum('inc'), saved=sum('saved');
  const st={y,H,ks,n:H.length,inc,fix:sum('fix'),varx:sum('varx'),hasVar:H.some(h=>h.varx!=null),saved,rate:inc?saved/inc:0,
    nw0:first?first.nw:null,nw1:last?last.nw:null,nwD:first&&last?last.nw-first.nw:null,best,costly,cats,em:last?last.em:null,fixLast:H[H.length-1].fix,
    chDone:state.challenges.filter(c=>c.status==='done'&&c.closedTs&&String(new Date(c.closedTs).getFullYear())===y),
    docs:state.docs.filter(d=>String(new Date(d.ts).getFullYear())===y).length, checksDone:Object.keys(state.checks[y]||{}).length};
  if(y===String(new Date().getFullYear())&&H.length>=2){
    const lastM=+ks[ks.length-1].slice(5), remain=12-lastM, step=nwH.length>1?(last.nw-first.nw)/(nwH.length-1):0;
    st.forecast={remain,saved:saved+saved/H.length*remain,nw:last?last.nw+step*remain:null};

}

/* ---------- Automation ---------- */
const nextYm = ym => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m,15); return d.toISOString().slice(0,7); };
function syncInvestPlan(){ const sum=state.holdings.reduce((a,h)=>a+(h.plan&&h.plan.amount||0),0); if(state.holdings.some(h=>h.plan)) state.investPlan.monthly=Math.round(sum); }
function applyStandingOrders(){
  const cur=ymNow(), day=new Date().getDate(); let n=0;
  state.holdings.forEach(h=>{
    const pl=h.plan; if(!pl||!(pl.amount>0)||!(h.price>0)) return;
    let ym=pl.last?nextYm(pl.last):cur, guard=0;
    while((ym<cur||(ym===cur&&day>=pl.day))&&guard<12){
      const fxr=h.cur==='USD'?(state.fx.usd||1):1, add=pl.amount/(h.price*fxr), u0=+h.units||0;
      h.cost=u0+add>0?((u0*(+h.cost||h.price))+(add*h.price))/(u0+add):h.price;
      h.units=+(u0+add).toFixed(4);
      (h.buys=h.buys||[]).push({ym,amt:pl.amount,units:+add.toFixed(4),price:h.price}); if(h.buys.length>60) h.buys=h.buys.slice(-60);
      pl.last=ym; ym=nextYm(ym); n++; guard++;
    }
  });
  if(n){ recordSnapshot(); state.autoLog.unshift({ts:Date.now(),t:`בוצעו ${n} קניות מהוראות קבע`}); }
  syncInvestPlan();
  return n;
}
function accrueSavings(){
  const cur=ymNow(); let n=0;
  state.savings.forEach(s=>{
    if(!(s.monthly>0)||s.type==='emergency') { if(!s.acc) s.acc=cur; return; }
    if(!s.acc){ s.acc=cur; return; }
    let ym=s.acc, guard=0;
    while(ym<cur&&guard<24){ ym=nextYm(ym); s.balance=Math.round((s.balance||0)+s.monthly); s.est=true; n++; guard++; }
    s.acc=cur;
  });
  if(n) state.autoLog.unshift({ts:Date.now(),t:`נוספו ${n} הפקדות חודשיות לקופות`});
  if(state.autoLog.length>30) state.autoLog=state.autoLog.slice(0,30);
  return n;
}

function attention(){
  const out=[], D=daily(), K=kpis();
  state.deadlines.forEach(d=>{ const n=daysUntil(d.date);
    if(n<0) out.push({lv:'bad',ic:'⏰',t:d.name,s:`באיחור ${-n} ימים`,act:`editDeadline('${d.id}')`,go:'לטפל'});
    else if(n<=14) out.push({lv:'near',ic:'📅',t:d.name,s:n===0?'היום':n===1?'מחר':`בעוד ${n} ימים`,act:`editDeadline('${d.id}')`,go:'פרטים'}); });
  const bad=reqSummary().R.filter(r=>r.st!=='ok').sort((a,b)=>(a.every-b.every)||(a.st==='miss'?-1:1));
  bad.slice(0,2).forEach(r=>out.push({lv:'near',ic:'📄',t:`${r.t}: ${r.st==='miss'?'חסר':'צריך עדכון'}`,s:r.src.split(',')[0],act:`openReq('${r.k}')`,go:'להשיג'}));
  if(bad.length>2) out.push({lv:'near',ic:'🗂️',t:`עוד ${bad.length-2} מסמכים חסרים או ישנים`,s:'רשימה מלאה עם דרך להשיג כל אחד',act:"go('deadlines')",go:'לרשימה'});
  if(D&&D.pace!=null&&D.pace>1.15) out.push({lv:'bad',ic:'💸',t:'ההוצאות החודש מעל הקצב',s:`היום אפשר עד ${fmt(Math.max(0,D.todayMax))}`,act:'openDaily()',go:'לפרטים'});
  state.savings.filter(feeFlag).forEach(s=>out.push({lv:'near',ic:'🏦',t:`דמי ניהול גבוהים ב${s.name}`,s:'שיחה אחת לחברה יכולה להוזיל',act:"go('savings')",go:'לבדוק'}));
  if(market&&market.updatedAt&&daysSince(market.updatedAt)>7) out.push({lv:'near',ic:'📈',t:'נתוני השוק ישנים',s:`מ־${shortDate(market.updatedAt)}. כתוב ל־Claude ״עדכן נתונים״`,act:"go('auto')",go:'איך'});
  state.challenges.filter(c=>c.status==='active').forEach(c=>{ const pr=chProgress(c), i=chInfo(c,pr); if(i.cls!=='good') out.push({lv:'near',ic:'🏁',t:`אתגר: ${c.title}`,s:`${i.label} · ${i.left}`,act:`openCh('${c.id}')`,go:'לאתגר'}); });
  (state.autoLog||[]).filter(l=>Date.now()-l.ts<7*864e5).slice(0,2).forEach(l=>out.push({lv:'good',ic:'⚙️',t:l.t,s:'בוצע אוטומטית',act:"go('auto')",go:''}));
  const o={bad:0,near:1,good:2}; return out.sort((a,b)=>o[a.lv]-o[b.lv]);
}

async function liveFx(){
  try{ const r=await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=ILS,EUR'); if(!r.ok) return false; const j=await r.json();
    const usd=+(j.rates&&j.rates.ILS), eu=+(j.rates&&j.rates.EUR); if(!(usd>2&&usd<6&&eu>0)) return false;

function applyMarketFx(){
  const f=market&&market.fx; if(!f||!f.usd) return false;
  if(state.fx.src==='manual'&&(state.fx.d||'')>=(f.date||'')) return false;
  if(state.fx.src==='market'&&state.fx.usd===f.usd) return false;
  state.fx={usd:+f.usd,src:'market',d:f.date||today()};

  return true;
}
function applyMarketPrices(){
  const P=market&&market.prices; if(!P) return 0;
  const map={}; for(const k in P) map[k.toLowerCase()]=P[k];
  let n=0;
  state.holdings.forEach(h=>{ const q=h.ticker&&map[h.ticker.toLowerCase()]; if(!q||!isFinite(+q.p)) return;
    const last=(h.hist||[])[h.hist.length-1]; if(h.price===+q.p&&last&&last.d>=(q.date||'')) return;
    h.price=+q.p; if(q.cur) h.cur=q.cur==='USD'?'USD':'ILS'; pushHist(h,h.price,q.date); n++; });
  if(n) recordSnapshot();
  return n;
}

function txOf(ym){ return state.tx.filter(t=>t.d&&t.d.slice(0,7)===ym); }
function txParts(t){ if(t.ex) return []; const s=t.a>0?(t.split||[]).filter(p=>p.a>0&&p.c):[]; const rest=t.a-s.reduce((a,p)=>a+p.a,0); return [{c:t.c,a:rest},...s]; }
function ensureBase(ym){ const sp=state.spend[ym]; if(sp&&!sp.base&&sp.src!=='tx'&&!txOf(ym).length) sp.base={total:sp.total||0,cats:{...(sp.cats||{})},n:sp.n||0}; }
function recomputeSpend(ym){
  const prev=state.spend[ym], base=prev&&prev.base?prev.base:null, list=txOf(ym);
  if(!list.length&&!base){ if(prev&&prev.src==='tx') delete state.spend[ym]; return; }
  const cats={}; let total=0,n=0;
  if(base){ for(const k in base.cats) cats[k]=(cats[k]||0)+base.cats[k]; total+=base.total||0; n+=base.n||0; }
  list.forEach(t=>{ if(t.ex) return; n++; txParts(t).forEach(p=>{ cats[p.c]=(cats[p.c]||0)+p.a; total+=p.a; }); });
  for(const k in cats) cats[k]=Math.round(cats[k]);
  const rec={total:Math.round(total),cats,n,ts:Date.now(),src:'tx'}; if(base) rec.base=base;
  state.spend[ym]=rec;
  if(ym!==ymNow()&&state.history[ym]) state.history[ym].varx=Math.round(varPart(rec));
}
function catFor(m){ const r=state.rules[norm(m)]; if(r) return r; const x=CAT_RULES.find(([re])=>re.test(m)); return x?x[1]:null; }

function split503020(ym){
  const t=totals(), h=state.history[ym], sp=state.spend[ym], cats=(sp&&sp.cats)||{};
  const inc=(ym===ymNow()?t.income:(h&&h.inc))||t.income;
  let needs=t.byCat.fixed+t.byCat.bills+t.byCat.insurance, wants=t.byCat.subs;
  for(const c in cats){ if(c==='חשבונות ומנויים') continue; if(NEEDS.includes(c)) needs+=cats[c]; else wants+=cats[c]; }
  return {inc,needs,wants,sav:inc-needs-wants};
}
function periodStats(per){
  const n={m:1,q:3,h:6,y:12}[per], ks=[]; for(let i=n-1;i>=0;i--) ks.push(ymShift(ymNow(),-i));
  let inc=0,fix=0,vx=0,months=0; const byM={};
  ks.forEach(k=>{ const h=state.history[k], sp=state.spend[k]; if(!h&&!sp) return; months++;
    inc+=k===ymNow()?totals().income:(h&&h.inc)||0; fix+=k===ymNow()?totals().expenses:(h&&h.fix)||0; vx+=sp?(varPart(sp)||0):((h&&h.varx)||0);
    txOf(k).forEach(t=>{ if(!t.ex) byM[t.m]=(byM[t.m]||0)+t.a; }); });
  const saved=inc-fix-vx;
  return {n,months,inc,fix,vx,saved,rate:inc>0?saved/inc:null,top:Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
function chargeDates(it,from,days){
  if(!it.day) return [];
  if(it.end){ return chargeDatesRaw(it,from,days).filter(d=>d<=it.end); }
  return chargeDatesRaw(it,from,days);
}
function chargeDatesRaw(it,from,days){
  const out=[], start=new Date(from); start.setHours(0,0,0,0);
  for(let k=0;k<3;k++){ const base=new Date(start.getFullYear(),start.getMonth()+k,1), mo=base.getMonth()+1;
    if(it.freq>1){ if(!it.m0) continue; if(((mo-it.m0)%it.freq+it.freq)%it.freq!==0) continue; }
    const dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate(), d=new Date(base.getFullYear(),base.getMonth(),Math.min(it.day,dim));
    const diff=Math.round((d-start)/864e5); if(diff>=0&&diff<days) out.push(isoLocal(d)); }
  return out;
}
function upcoming(days){
  const now=new Date(), list=[];
  state.items.forEach(it=>chargeDates(it,now,days).forEach(d=>list.push({d,name:it.name,a:it.cat==='income'?it.amount:-it.amount,cat:it.cat,id:it.id})));
  state.deadlines.forEach(dl=>{ const n=daysUntil(dl.date); if(n>=0&&n<days) list.push({d:dl.date,name:dl.name,a:null,dl:true,id:dl.id}); });
  return list.sort((a,b)=>a.d.localeCompare(b.d));
}

function calGrid(){

function avgVar3(){ const ks=Object.keys(state.spend).filter(k=>k<ymNow()).sort().slice(-3); return ks.length?ks.reduce((a,k)=>a+(varPart(state.spend[k])||0),0)/ks.length:(varPart(state.spend[ymNow()])||0); }

function fiCalc(o){

      return RES([['החזר משכנתא',p],['הון אם קונים',buyNW,buyNW>=rentNW?'ok':''],['הון אם שוכרים ומשקיעים',rentNW,rentNW>buyNW?'ok':''],['הפער',Math.abs(buyNW-rentNW)]])+`<p class="note">מודל פשוט: עלויות קנייה של 2.5%, תחזוקה 0.5% בשנה, שכירות שעולה 3% בשנה, ומי ששוכר משקיע את ההון העצמי ואת ההפרש. מס רכישה, מס רווחי הון ועלויות מעבר לא נכללים במדויק.</p>`; }},
  prepay:{ic:'⚖️',t:'להחזיר משכנתא או להשקיע',d:'מה עדיף לסכום פנוי',f:[['amt','סכום פנוי',100000],['mr','ריבית המשכנתא (%)',4.8,.1],['yrs','שנים שנותרו',20],['ret','תשואה צפויה בהשקעה (%)',6,.5],['tax','מס על רווחים (%)',25,1]],
    calc:v=>{ const a=v.amt*Math.pow(1+v.mr/100,v.yrs), g=v.amt*Math.pow(1+v.ret/100,v.yrs), b=g-(g-v.amt)*v.tax/100; return RES([['ערך הפירעון המוקדם',a,a>=b?'ok':''],['ערך ההשקעה אחרי מס',b,b>a?'ok':''],['הפער',Math.abs(a-b)]])+`<p class="note">פירעון מוקדם הוא תשואה בטוחה בגובה ריבית המשכנתא. השקעה עשויה להניב יותר, אבל עם סיכון. בדוק עמלת פירעון מוקדם בבנק, בעיקר במסלול קבוע.</p>`; }},
  car:{ic:'🚗',t:'כמה עולה רכב',d:'עלות אמיתית לחודש ולקילומטר',f:[['price','מחיר הרכב',130000],['yrs','כמה שנים תחזיק',5],['res','ערך בסוף (%)',50,1],['km','ק״מ בשנה',15000],['kml','ק״מ לליטר',15,.5],['fuel','מחיר ליטר',7.2,.1],['ins','ביטוח לשנה',5500],['mnt','טיפולים ורישוי לשנה',4000],['park','חניה בחודש',0]],
    calc:v=>{ const m=v.yrs*12, dep=v.price*(1-v.res/100)/m, fuel=v.km/12/v.kml*v.fuel, opp=v.price*.04/12, tot=dep+fuel+v.ins/12+v.mnt/12+v.park; return RES([['עלות בחודש',tot+opp,'ok'],['ירידת ערך',dep],['דלק',fuel],['ביטוח, טיפולים וחניה',v.ins/12+v.mnt/12+v.park],['ריבית אבודה על הכסף (4%)',opp],['לקילומטר',((tot+opp)*12/v.km).toFixed(2)+' ₪']]); }},
  trip:{ic:'✈️',t:'תקציב חופשה',d:'כמה יעלה וכמה לחסוך בחודש',f:[['ppl','כמה אנשים',2],['fl','טיסה לאדם',1200],['nights','לילות',6],['hotel','מלון ללילה',600],['day','הוצאה יומית לאדם',350],['mo','בעוד כמה חודשים',6]],
    calc:v=>{ const tot=v.ppl*v.fl+v.nights*v.hotel+v.ppl*v.day*(v.nights+1); return RES([['עלות כוללת',tot,'ok'],['לאדם',tot/Math.max(1,v.ppl)],['לחסוך בחודש',tot/Math.max(1,v.mo)]])+`<p class="note">אחרי הטיול אפשר לתייג את התנועות ב״תנועות״ ולראות כמה זה עלה באמת.</p>`; }},
  sev:{ic:'📦',t:'פיצויי פיטורין',d:'חישוב בסיסי',f:[['sal','שכר חודשי אחרון',15000],['yrs','שנות עבודה',3.5,.1],['s14','סעיף 14 בחוזה','0',{'0':'לא','1':'כן, מלא'}]],
    calc:v=>RES([['פיצויים לפי החוק',v.sal*v.yrs,'ok']])+`<p class="note">${+v.s14?'עם סעיף 14 מלא, הפיצויים הם הכסף שהמעסיק הפקיד לרכיב הפיצויים בפנסיה, ולא תשלום נוסף.':'שכר אחרון כפול שנות עבודה. יש תקרת פטור ממס לכל שנה.'} <a href="https://www.kolzchut.org.il/he/פיצויי_פיטורים" target="_blank" rel="noopener">הסבר בכל זכות</a></p>`},
  fees:{ic:'🏦',t:'דמי ניהול בפנסיה',d:'כמה עולה הפרש קטן לאורך שנים',f:[['bal','צבירה היום',60000],['dep','הפקדה חודשית',2200],['yrs','שנים לפרישה',41],['ret','תשואה שנתית (%)',4,.5],['d1','מסלול א: מהפקדה (%)',1,.1],['b1','מסלול א: מצבירה (%)',.15,.01],['d2','מסלול ב: מהפקדה (%)',6,.1],['b2','מסלול ב: מצבירה (%)',.5,.01]],
    calc:v=>{ const run=(d,b)=>{ const r=Math.pow(1+v.ret/100,1/12)-1, f=b/1200; let x=v.bal; for(let i=0;i<v.yrs*12;i++) x=x*(1+r-f)+v.dep*(1-d/100); return x; }; const a=run(v.d1,v.b1), b=run(v.d2,v.b2);
      return RES([['מסלול א בפרישה',a],['מסלול ב בפרישה',b],['הפער',Math.abs(a-b),'ok']])+`<p class="note">המקסימום בחוק הוא 6% מהפקדה ו־0.5% מצבירה. אפשר להתמקח, או לבדוק את קרנות ברירת המחדל. <a href="https://gemelnet.cma.gov.il/" target="_blank" rel="noopener">השוואה בגמל־נט</a></p>`; }},
  emergency:{ic:'🛟',t:'קרן חירום',d:'כמה צריך ומה חסר',f:[['exp','הוצאה חודשית הכרחית',emDefault],['mo','כמה חודשים',6],['have','יש לי היום',()=>Math.round(metrics().emergency)],['add','אפשר לשים בצד בחודש',1000]],
    calc:v=>{ const tgt=v.exp*v.mo, gap=Math.max(0,tgt-v.have); return RES([['היעד',tgt],['חסר',gap,gap?'warn':'ok'],['זמן להשלמה',gap?(v.add>0?Math.ceil(gap/v.add)+' חודשים':'—'):'הושלם ✓']])+`<p class="note">ל־3–6 חודשי הוצאות במקום נזיל: פיקדון, קרן כספית או חשבון חיסכון.</p>`; }},

function openTool(k){
  const T=TOOLS[k], val=x=>typeof x==='function'?x():x;
  sheet(`<h2>${T.ic} ${T.t}</h2>${T.f.length?`<div class="tgrid">${T.f.map(([id,l,v,o])=>`<div class="field"><label for="tl-${id}">${l}</label>${o&&typeof o==='object'?`<select id="tl-${id}" onchange="toolCalc('${k}')">${Object.entries(o).map(([a,b])=>`<option value="${a}" ${String(val(v))===a?'selected':''}>${b}</option>`).join('')}</select>`:`<input id="tl-${id}" type="number" inputmode="decimal" step="${o||'any'}" value="${val(v)}" oninput="toolCalc('${k}')">`}</div>`).join('')}</div>`:''}
    <div class="res" id="tl-out"></div><div class="actions"><button class="btn ghost" onclick="closeSheet()">סגור</button></div>`); toolCalc(k);
}
function toolCalc(k){ const T=TOOLS[k], v={}; T.f.forEach(([id,,,o])=>{ const el=document.getElementById('tl-'+id); v[id]=o&&typeof o==='object'?el.value:(num(el.value)||0); }); let h=''; try{ h=T.calc(v); }catch(e){ h='<p class="empty">בדוק את המספרים.</p>'; } document.getElementById('tl-out').innerHTML=h; }

/* ---------- Instinct sync through Google Drive ----------
   Instinct (the WhatsApp assistant) and Status meet in the user's Google Drive:
   - a folder "Status Inbox" where Instinct drops monthly files (statements, payslips, Splitwise CSV)
   - a sheet "Status · משימות ל־Instinct": tab "משימות" is written by the site, tab "מ־Instinct" is written by Instinct.
   The site reads with the user's own Google sign-in. Nothing goes through any other server. */
const IN_FOLDER='Status Inbox', IN_SHEET='Status · משימות ל־Instinct', T_TASKS='משימות', T_FROM='מ־Instinct';
const GAPI='https://www.googleapis.com', SAPI='https://sheets.googleapis.com/v4/spreadsheets';
const inUI={busy:false,msg:'',err:'',skipped:[]};
/* Google sends the Drive permission back in the address (#access_token=...). Read it once and clean the address. */
const inBack=(function(){
  const h=location.hash||''; if(!/[#&](access_token|error)=/.test(h)) return null;
  const p=new URLSearchParams(h.slice(1)); let ok=false; try{ ok=!!p.get('state')&&p.get('state')===sessionStorage.getItem('st-oauth-state'); sessionStorage.removeItem('st-oauth-state'); }catch(e){}
  let autoBack=false; try{ autoBack=sessionStorage.getItem('st-gtok-auto-pending')==='1'; sessionStorage.removeItem('st-gtok-auto-pending'); if(autoBack) sessionStorage.removeItem('st-gtok-pending'); }catch(e){}
  try{ history.replaceState(null,'',location.pathname+location.search+(autoBack?'#home':'#instinct')); }catch(e){}
  if(!ok) return {err:'הבקשה לא אומתה. נסה שוב.'};
  if(p.get('error')){ try{ sessionStorage.removeItem('st-gtok-pending'); }catch(e){} return {err:p.get('error')==='access_denied'?'לא אושרה גישה ל־Drive.':'Google החזיר שגיאה: '+p.get('error')}; }
  const sc=p.get('scope')||''; if(!/drive\.readonly/.test(sc)) { try{ sessionStorage.removeItem('st-gtok-pending'); }catch(e){} return {err:'צריך לסמן את הגישה לקבצים ב־Drive בחלון של Google. נסה שוב וסמן את כל התיבות.'}; }
  try{ sessionStorage.setItem('st-gtok',JSON.stringify({t:p.get('access_token'),u:null,exp:Date.now()+Math.min(+p.get('expires_in')||3600,3600)*1000-120000})); }catch(e){}
  return {ok:true};
})();
const qs=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
async function gfetch(tok,url,opt={}){
  const h={Authorization:'Bearer '+tok}; if(typeof opt.body==='string') h['Content-Type']='application/json';
  const r=await fetch(url.startsWith('http')?url:GAPI+url,{method:opt.method||'GET',body:opt.body,headers:h});
  if(!r.ok){ let m=''; try{ const j=await r.json(); m=j.error&&(j.error.message||j.error.status)||''; }catch(e){} const e=new Error(m||('HTTP '+r.status)); e.status=r.status; throw e; }
  return opt.blob?r.blob():r.status===204?null:r.json();
}

async function sheetPut(tok,id,range,values){ return gfetch(tok,`${SAPI}/${id}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({range,values})}); }

  const L=await gfetch(tok,'/drive/v3/files?'+qs({q:`name='${IN_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,fields:'files(id)',spaces:'drive'}));

async function inSheet(tok,folder){

  if(I.sheetId){ try{ await gfetch(tok,`${SAPI}/${I.sheetId}?fields=spreadsheetId`); return I.sheetId; }catch(e){ if(e.status!==404&&e.status!==403) throw e; } }
  const sh=await gfetch(tok,SAPI,{method:'POST',body:JSON.stringify({properties:{title:IN_SHEET,locale:'iw_IL',timeZone:'Asia/Jerusalem'},
    sheets:[{properties:{title:T_TASKS,rightToLeft:true,gridProperties:{frozenRowCount:1}}},{properties:{title:T_FROM,rightToLeft:true,gridProperties:{frozenRowCount:1}}}]})});
  I.sheetId=sh.spreadsheetId;

const T_SW='Splitwise';
/* Splitwise through a small Google Apps Script in your own account (the API key stays there).
   The script writes a "Splitwise" tab every hour; the site reads it on entry. */
const SW_GAS="/* Status · Splitwise sync\n   Runs in your own Google account (script.google.com). Every hour it reads Splitwise\n   and writes balances and recent expenses to the \"Splitwise\" tab of your Status sheet.\n   The API key is kept only in this project's Script Properties, never in the site's code. */\nconst SHEET_ID = '__SHEET_ID__';\nconst SW = 'https://secure.splitwise.com/api/v3.0/';\nconst TZ = 'Asia/Jerusalem';\n\nfunction sw_(path) {\n  const key = PropertiesService.getScriptProperties().getProperty('SPLITWISE_API_KEY');\n  if (!key) throw new Error('Missing SPLITWISE_API_KEY in Project Settings > Script properties');\n  const r = UrlFetchApp.fetch(SW + path, { headers: { Authorization: 'Bearer ' + key }, muteHttpExceptions: true });\n  if (r.getResponseCode() !== 200) throw new Error('Splitwise ' + r.getResponseCode() + ': ' + r.getContentText().slice(0, 200));\n  return JSON.parse(r.getContentText());\n}\nconst nameOf_ = u => [u.first_name, u.last_name].filter(Boolean).join(' ');\n\nfunction splitwiseSync() {\n  const me = sw_('get_current_user').user, myId = me.id;\n  const rows = [['meta', new Date().toISOString(), nameOf_(me)]];\n  const groups = sw_('get_groups').groups || [], gname = {};\n  groups.forEach(g => {\n    gname[g.id] = g.id === 0 ? 'ללא קבוצה' : g.name;\n    const m = (g.members || []).find(x => x.id === myId); if (!m) return;\n    const bal = (m.balance || []).filter(b => Number(b.amount) !== 0);\n    if (g.id === 0 && !bal.length) return;\n    (bal.length ? bal : [{ amount: 0, currency_code: 'ILS' }]).forEach(b => rows.push(['group', gname[g.id], Number(b.amount), b.currency_code]));\n    const who = id => { const u = (g.members || []).find(x => x.id === id); return u ? nameOf_(u) : String(id); };\n    const debts = (g.simplified_debts && g.simplified_debts.length) ? g.simplified_debts : (g.original_debts || []);\n    debts.forEach(d => {\n      if (d.to === myId) rows.push(['debt', gname[g.id], Number(d.amount), d.currency_code, who(d.from), 'owes_me']);\n      else if (d.from === myId) rows.push(['debt', gname[g.id], Number(d.amount), d.currency_code, who(d.to), 'i_owe']);\n    });\n  });\n  const since = new Date(Date.now() - 90 * 864e5).toISOString();\n  for (let offset = 0, page = 0; page < 10; page++, offset += 100) {\n    const ex = sw_('get_expenses?limit=100&offset=' + offset + '&dated_after=' + encodeURIComponent(since)).expenses || [];\n    ex.forEach(e => {\n      if (e.deleted_at) return;\n      const u = (e.users || []).find(x => x.user_id === myId); if (!u) return;\n      rows.push(['exp', String(e.id), Utilities.formatDate(new Date(e.date), TZ, 'yyyy-MM-dd'), e.description || '', Number(e.cost),\n        e.currency_code, gname[e.group_id || 0] || '', Number(u.net_balance), Number(u.owed_share), Number(u.paid_share),\n        e.payment ? 1 : 0, (e.category && e.category.name) || '']);\n    });\n    if (ex.length < 100) break;\n  }\n  const ss = SpreadsheetApp.openById(SHEET_ID);\n  const sh = ss.getSheetByName('Splitwise') || ss.insertSheet('Splitwise');\n  const W = 12, out = rows.map(r => { const x = r.slice(0, W); while (x.length < W) x.push(''); return x; });\n  sh.clearContents();\n  sh.getRange(1, 1, out.length, W).setValues(out);\n}\n\n/* Run this once. It turns on the hourly update and runs the first one. */\nfunction installHourly() {\n  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'splitwiseSync').forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('splitwiseSync').timeBased().everyHours(1).create();\n  splitwiseSync();\n}\n";
async function sheetSplitwise(tok){
  const id=state.instinct.sheetId; if(!id) return null;
  const meta=await gfetch(tok,`${SAPI}/${id}?fields=sheets(properties(title))`);

}
function applySplitwiseApi(rows){
  const M=(rows||[]).find(r=>r[0]==='meta'); if(!M) return null;
  const at=Date.parse(M[1])||Date.now(), d=isoOf(at), G={}, D={};
  rows.filter(r=>r[0]==='group').forEach(r=>{ const rate=swRate(r[3]); if(rate==null) return; G[r[1]]=(G[r[1]]||0)+Number(r[2])*rate; });
  rows.filter(r=>r[0]==='debt').forEach(r=>{ const rate=swRate(r[3])||1; (D[r[1]]=D[r[1]]||[]).push({who:String(r[4]),a:R2(Number(r[2])*rate),dir:r[5]}); });
  state.splitwise=state.splitwise||{};
  Object.entries(G).forEach(([g,b])=>{ state.splitwise[g]={bal:Math.round(b),d,me:'Splitwise (חיבור ישיר)',src:'api',at,debts:D[g]||[]}; });
  const yms=new Set(); let n=0; const have=new Set(state.tx.map(t=>t.swk).filter(Boolean));

async function cibusFile(f){
  if(!CIBUS_RE.test(f.name)||/\.pdf$/i.test(f.name)) return null;
  const XLSX=await loadXLSX(); let wb;
  if(/\.csv$/i.test(f.name)||f.type==='text/csv'){ const buf=await f.arrayBuffer(); let t=new TextDecoder('utf-8').decode(buf); if(t.includes('�')) t=new TextDecoder('windows-1255').decode(buf); wb=XLSX.read(t,{type:'string',cellDates:true,raw:true}); }
  else wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  const h=rows.findIndex(r=>{ const L=r.map(x=>String(x).trim().toLowerCase()); return L.some(x=>/^(date|תאריך)/.test(x))&&L.some(x=>/(amount|סכום|מחיר|total)/.test(x)); }); if(h<0) return null;
  const L=rows[h].map(x=>String(x).trim().toLowerCase()), di=L.findIndex(x=>/^(date|תאריך)/.test(x)), ai=L.findIndex(x=>/(amount|סכום|מחיר|total)/.test(x)), mi=L.findIndex(x=>/(restaurant|merchant|place|business|description|מסעדה|בית עסק|מקום|תיאור|ספק)/.test(x));
  const out=[]; for(let r=h+1;r<rows.length;r++){ const row=rows[r]; if(!row||!row.length) continue; const dv=row[di], d=dv instanceof Date?isoLocal(dv):/^\d{4}-\d{2}-\d{2}/.test(String(dv).trim())?String(dv).trim().slice(0,10):parseDate(dv); const a=parseAmount(row[ai]);
    if(!d||!isFinite(a)||a<=0) continue; const m=String(mi>=0?row[mi]:'').trim().slice(0,60)||'סיבוס'; out.push({d,a:R2(a),m,key:`cb:${d}|${m}|${R2(a)}`}); }
  return out.length?{file:f.name,rows:out}:null;
}

function fv(pv,pm,ann,years){ const r=ann/100/12, n=years*12; if(r===0) return pv+pm*n; const g=Math.pow(1+r,n); return pv*g+pm*(g-1)/r; }

  const prompt=`You are reviewing a private household's investment snapshot inside their budgeting app. The user lives in Israel and thinks in shekels.
Write in Hebrew, warm and plain. 4 to 5 short paragraphs separated by a blank line, each one or two sentences, each starting with a two-or-three-word topic and a colon. No markdown, no bullets, no bold.
Lens: the passive approach from the book "השקעות לעצלנים" (broad low-cost index funds, steady monthly deposits, patience, low fees) together with its known blind spots: currency exposure for someone living in shekels, US estate-tax exposure on US-domiciled funds held directly, bonds not always moving opposite to stocks, the need for an emergency fund so a market drop never forces a sale, and matching the stock share to age and goals.
Point out what is working and what is worth checking. Do not name securities to buy or sell and do not tell them to buy or sell. Finish with one sentence saying this is not personal investment advice.
Data: ${JSON.stringify(summary)}`;
  sheet(`<h2>בדיקת תיק</h2><div class="review" id="rv"><p class="status"><span class="dots">חושב</span></p></div>
    <div class="actions"><button class="btn ghost" id="rv-stop" onclick="reviewCtl&&reviewCtl.abort()">עצור</button><button class="btn primary" onclick="closeSheet()">סגור</button></div>`);
  reviewCtl=new AbortController();
  const box=()=>document.getElementById('rv');

}

    const cat=SPEND_CATS.includes(f.category)?f.category:'אחר', d=/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')?f.date:today(), ym=d.slice(0,7);

function cancelEndFor(day,freq,m0,from){
  if(!day) return today(); const n=nextChargeRaw({day,freq:freq||1,m0:m0||null},from||new Date(Date.now()+864e5)); if(!n) return today();

}

function fillItemDays(){

    const T=state.tx.filter(t=>t.a>0&&W.some(w=>norm(t.m).includes(w))&&Math.abs(t.a-i.amount)<=Math.max(3,i.amount*0.3)).sort((a,b)=>b.d.localeCompare(a.d));

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

async function loadCfg(){
  const r = await fetch('firebase-config.js?v=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('nocfg');
  const t = await r.text();
  const m = t.match(/\{[^{}]*apiKey[^{}]*\}/);
  if (!m) throw new Error('nocfg');
  return Function('"use strict";return (' + m[0] + ')')();
}
let cfg;
try { cfg = await loadCfg(); }
catch (e) { window.FB_SETUP = true; window.dispatchEvent(new CustomEvent('fb-error', { detail: 'ההגדרה של מערכת ההתחברות עוד לא הושלמה. חסר הקובץ firebase-config.js.' })); throw e; }

const ERR = c => ({ 'auth/popup-closed-by-user':'החלון נסגר לפני שהכניסה הסתיימה.', 'auth/popup-blocked':'הדפדפן חסם את חלון הכניסה. אפשר חלונות קופצים לאתר הזה ונסה שוב.', 'auth/unauthorized-domain':'הכתובת הזו לא מאושרת לכניסה.', 'permission-denied':'לחשבון הזה אין גישה לאזור האישי.' })[c] || 'הכניסה לא הצליחה. נסה שוב.';

  ref: () => doc(db, 'users', auth.currentUser.uid, 'data', 'state'),

    const q = new URLSearchParams({ client_id: '14984346956-g996nd4dabufl35nc300mm41c37e744t.apps.googleusercontent.com', redirect_uri: location.origin + location.pathname.replace(/index\.html$/, ''), response_type: 'token',
      scope: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file', include_granted_scopes: 'true', login_hint: (auth.currentUser && auth.currentUser.email) || '', state: st });

  save: async (r, d) => {

      const s = await txn.get(r);
      const prevData = s.exists() ? s.data() : null;
      const prevV = (prevData && typeof prevData.v === 'number') ? prevData.v : 0;
      const prevState = prevData ? JSON.parse(prevData.json) : null;

      if (!prevState) { merged = d; }

  load: async r => { const s = await getDoc(r); if (!s.exists()) return null; const d = s.data(); return Object.assign(JSON.parse(d.json), { v: typeof d.v === 'number' ? d.v : 0 }); },
  watch: (r, cb, err) => onSnapshot(r, s => { if (!s.exists()) { cb(null, s.metadata.hasPendingWrites); return; } const d = s.data(); cb(Object.assign(JSON.parse(d.json), { v: typeof d.v === 'number' ? d.v : 0 }), s.metadata.hasPendingWrites); }, e => { if (e && e.code === 'permission-denied') window.dispatchEvent(new CustomEvent('fb-error', { detail: ERR('permission-denied') })); if (err) err(e); })
};
onAuthStateChanged(auth, async u => {
  if (u) {
    try { await getDoc(doc(db, 'users', u.uid, 'data', 'state')); }
    catch (e) { if (e.code === 'permission-denied') { await signOut(auth); window.dispatchEvent(new CustomEvent('fb-error', { detail: ERR('permission-denied') })); return; } }
  }
  window.FB.user = u ? { uid: u.uid, email: u.email } : null;
  window.dispatchEvent(new CustomEvent('fb-auth', { detail: window.FB.user }));
});
